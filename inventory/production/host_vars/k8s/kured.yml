---
# Kubernetes Reboot Daemon configuration.
#
# Behavior: watches /var/run/reboot-required on every node (DaemonSet).
# When that sentinel file appears (typically created by unattended-upgrades
# after a kernel/security update), kured acquires a cluster-wide lock,
# drains the node, reboots it, waits for Ready, releases the lock.
# Repeats for the next node that needs a reboot.
kured:
  namespace: "kured"
  release_name_prefix: "h3xinfra-kured"

  # How often to check the sentinel. kured does NOT check on startup —
  # only on the period ticker — so this is also the maximum latency
  # between sentinel creation and kured reacting. 10m is a reasonable
  # homelab default; production fleets that batch reboots into a
  # maintenance window often use 1h.
  period: "10m"

  # Pod termination grace period during drain. 180s gives Plex, *arr apps,
  # and CNPG/Keycloak ample time for clean shutdown.
  drain_grace_period: "180"

  # Delay between drain completion and reboot command. Lets Longhorn
  # observe the cordon + finish migrating replicas off the node.
  reboot_delay: "60s"

  # Auto-release the cluster lock if a reboot stalls (e.g. node never
  # comes back Ready). Keeps the rest of the fleet reboot-able.
  lock_ttl: "30m"

  # Optional maintenance window. Empty = 24/7 eligible to reboot.
  # Example: only reboot between 02:00 and 06:00 UTC:
  #   start_time: "02:00"
  #   end_time:   "06:00"
  #   time_zone:  "UTC"
  start_time: ""
  end_time: ""
  time_zone: ""

  # Tolerations for kured DaemonSet pod. kured must run on every node so
  # any node can get rebooted. Default matches the system-DS pattern of
  # tolerating all taints (cilium, csi-driver-smb, etc.) — appropriate
  # since you can't reboot a node without an agent on it.
  tolerations:
    - operator: Exists

  # Optional notification webhook (Slack, Discord via shoutrrr, etc.).
  # Example:
  #   extra_env_vars:
  #     - name: KURED_NOTIFY_URL
  #       valueFrom:
  #         secretKeyRef:
  #           name: kured-notify
  #           key: url
  extra_env_vars: []

  # PreferNoSchedule taint applied to nodes awaiting reboot (see 10-kured).
  prefer_no_schedule_taint: "weave.works/kured-node-reboot"

  # Hold the lock this long after a node is back Ready, so Longhorn has
  # re-reported the node's volumes and the rebuild gate below is visible again
  # before another node may take the lock.
  lock_release_delay: "5m"

  # Prometheus circuit breaker: kured will not take the reboot lock while any
  # alert matching the regexp is firing (fail-closed: unreachable Prometheus
  # also blocks). Requires the storage-ops rules from 22-monitoring AND the
  # Longhorn metrics from 09-longhorn (ServiceMonitor + NetworkPolicy); apply
  # 09-longhorn and 22-monitoring before 10-kured, otherwise
  # LonghornMetricsAbsent fires 15 min later and blocks every reboot.
  # Empty prometheus_url disables the check.
  prometheus_url: "http://h3xinfra-monitoring-main-prometheus.monitoring.svc.cluster.local:9090"
  alert_filter_regexp: "^(LonghornRebuildInProgress|LonghornVolumeFaulted|LonghornMetricsAbsent)$"
