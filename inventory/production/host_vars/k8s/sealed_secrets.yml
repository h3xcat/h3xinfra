---
sealed_secrets:
  # Enable after the sealing key Secret exists (see the layer README).
  # stack-standup.yml skips the layer while this is false.
  enabled: false
  namespace: sealed-secrets
  release_name_prefix: h3xinfra-sealed-secrets
  # Operator-supplied kubernetes.io/tls Secret in `namespace` with the label
  # sealedsecrets.bitnami.com/sealed-secrets-key=active. This repo never
  # creates it; the controller must not generate its own key.
  key_secret_name: h3xinfra-sealed-secrets-key
  # Old key Secrets that stay active during a rotation. The play stops when
  # any other Secret in `namespace` has the active label.
  previous_key_secret_names: []
