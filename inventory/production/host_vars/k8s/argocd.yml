---
argocd:
  # Enable after provisioning the Keycloak client described in the layer README.
  enabled: false
  namespace: argocd
  release_name_prefix: h3xinfra-argocd
  hostname: "argocd.app.{{ domain_name }}"
  gateway:
    name: h3xinfra-gateway-pre-shared
    namespace: envoy-gateway-system
    section_name: https-app
  oidc:
    issuer: "https://keycloak.app.{{ domain_name }}/realms/h3xinfra"
    client_id: argocd
    # Public Keycloak client with PKCE S256; no client secret is used.
  rbac:
    # Group names must match the Keycloak groups claim. No default access.
    policy_csv: |
      g, argocd-admins, role:admin
      g, argocd-readonly, role:readonly
  # Optional KSOPS decryption of SOPS/age files in kustomize builds. It is off
  # by default. Read the KSOPS section of the layer README before you enable it.
  # With KSOPS on, `applications, get` (role:readonly too) lets a user build
  # any revision of a source repository, which runs code in the repo-server.
  ksops:
    enabled: false
    # Secret in the Argo CD namespace with the age identity in key keys.txt.
    # Provision it separately, like repository credentials.
    age_secret_name: h3xinfra-argocd-sops-age
