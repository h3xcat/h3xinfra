# =============================================================================
# CENTRALIZED CHART VERSIONS
# =============================================================================
# This file provides default chart versions for all services.
# Uses a separate 'chart_versions' namespace to avoid conflicts with host_vars.
# =============================================================================

chart_versions:
  # Infrastructure - Networking
  # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
  cilium: "1.20.4"
  # renovate: datasource=helm depName=metallb registryUrl=https://metallb.github.io/metallb
  metallb: "0.16.2"
  # Envoy Gateway controller (replaces ingress-nginx).
  # renovate: datasource=docker depName=envoyproxy/gateway-helm registryUrl=https://docker.io versioning=helm
  envoy_gateway: "1.10.0"
  # renovate: datasource=helm depName=external-dns registryUrl=https://kubernetes-sigs.github.io/external-dns
  external_dns: "1.23.0"

  # Infrastructure - Security & Certs
  # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
  cert_manager: "v1.21.3"
  # renovate: datasource=docker depName=quay.io/keycloak/keycloak
  keycloak: "26.8.2"

  # Infrastructure - Storage
  # renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io
  longhorn: "1.13.0"
  # renovate: datasource=helm depName=csi-driver-smb registryUrl=https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
  csi_driver_smb: "1.20.4"

  # Infrastructure - Lifecycle
  # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
  argocd: "10.14.0"
  # Kubernetes Reboot Daemon — orchestrates rolling node reboots when
  # /var/run/reboot-required is set (e.g. after kernel updates).
  # renovate: datasource=helm depName=kured registryUrl=https://kubereboot.github.io/charts
  kured: "6.1.0"

  # Applications
  # renovate: datasource=helm depName=mailu registryUrl=https://mailu.github.io/helm-charts
  mailu: "2.8.0"

# CLI Tools
cli_versions:
  # renovate: datasource=github-releases depName=longhorn/cli
  longhorn_cli: "v1.13.0"

# =============================================================================
# CENTRALIZED IMAGE VERSIONS
# =============================================================================
# Container image tags managed centrally for Renovate automation.
# Playbooks should use: {{ image_versions.postgresql }}
# =============================================================================

image_versions:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresql: "18"
