---
# K3s cluster configuration
# renovate: datasource=github-releases depName=k3s-io/k3s versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\+k3s(?<build>\d+)$
k3s_version: v1.37.2+k3s1
# Agents join with a separate agent token when k3s_agent_token is set (servers
# get it as agent-token below). Servers always use the server token.
token: "{{ k3s_agent_token if (k3s_agent_token is defined and inventory_hostname not in groups['server']) else k3s_token }}"

# K3s server configuration
server_config_yaml: |
  cluster-cidr: 10.42.0.0/16,2001:db8:cafe:0::/96
  service-cidr: 10.43.0.0/16,fd00:cafe:43::/112
  tls-san:
  - k8s.example.com
  kube-controller-manager-arg: "node-cidr-mask-size-ipv6=112"
  flannel-backend: none
  disable-network-policy: true
  disable-kube-proxy: false
  # Encrypt Secrets at rest. This line suits a new cluster. For a cluster
  # that already runs without it, do "Enable Secrets Encryption on an Existing
  # Cluster" (docs.k3s.io/cli/secrets-encrypt) first: run
  # `k3s secrets-encrypt enable` on the first server before you deploy this
  # line. If you do not, 01-k3s/standup.yml stops before it restarts a server.
  secrets-encryption: true
  {{ ('agent-token: ' ~ (k3s_agent_token | to_json)) if k3s_agent_token is defined else '' }}
  node-taint:
  - "CriticalAddonsOnly=true:NoSchedule"      
  disable:
  - servicelb
  - traefik
  # Retire only after the 01-k3s local-storage consumer/recovery checks.
  - local-storage
  kube-apiserver-arg:
  - "anonymous-auth=true"
  - "enable-aggregator-routing=true"

# kube-apiserver audit logging (playbooks/01-k3s/apiserver-audit.yml).
apiserver_audit:
  enabled: true
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30

# Cluster-wide Pod Security Admission defaults (playbooks/01-k3s/apiserver-admission.yml).
# They apply only to namespaces without pod-security.kubernetes.io/* labels.
# Keep enforce at privileged until each namespace has its labels.
apiserver_pod_security:
  enabled: true
  defaults:
    enforce: privileged
    audit: restricted
    warn: restricted
  # An exempt namespace gets no checks, no audit annotations and no warnings.
  # K3s owns kube-system and starts pods there before any layer can label it.
  exemptions:
    namespaces:
    - kube-system

# Kubelet hardening (playbooks/01-k3s/standup.yml). Both default to false.
# protect_kernel_defaults: the playbook pins and checks the kernel values that
# the kubelet expects before the kubelet restarts.
kubelet_protect_kernel_defaults: true
# seccomp_default: it changes the seccomp profile of every new container that
# does not set one. Do a staged rollout:
#   1. Set it to true in the host_vars of one node.
#   2. Run 01-k3s on that node and recreate its pods.
#   3. Make sure that the pods start. Then set it to true here.
kubelet_seccomp_default: false

# Containerd registry configuration (playbooks/01-k3s/registries.yml). Off when
# not set. A change restarts K3s on each node, one node at a time. See the
# 01-k3s README for rotation and removal (state: absent).
# k3s_registries:
#   configs:
#     ghcr.io:
#       auth:
#         username: example-user
#         password: "{{ vault_k3s_registry_ghcr_token }}"

# Kubelet allowlist for unsafe sysctls (playbooks/01-k3s/kubelet-sysctls.yml).
# Default []. Set it in the host_vars of every node where the pod can run,
# and run kubelet-sysctls.yml before you deploy the pod (SysctlForbidden
# otherwise). See the 01-k3s README, "Unsafe Sysctls".
# kubelet_allowed_unsafe_sysctls:
#   - net.ipv4.conf.all.src_valid_mark
