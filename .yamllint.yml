# Shared yamllint configuration for public and private repository checks.
# The private test harness uses this file from its public submodule.
# Syntax errors and duplicate keys fail; existing style issues warn.
extends: relaxed

ignore: |
  **/charts/*/templates/**
  .terraform/
  node_modules/
  .git/
  .venv/

rules:
  line-length: disable
  document-start: disable
  truthy: disable
  key-duplicates: {level: error}
  trailing-spaces: {level: warning}
  commas: {level: warning}
  new-line-at-end-of-file: {level: warning}
  indentation: {level: warning, indent-sequences: consistent}
  empty-lines: {level: warning}
  colons: {level: warning}
  hyphens: {level: warning}
  comments: {level: warning}
  comments-indentation: {level: warning}
  brackets: {level: warning}
  braces: {level: warning}
