[defaults]
# Pinned to 1: the k3s standup path (k3s.orchestration.site) has no `serial`
# keyword, so with forks>1 it restarts multiple etcd-member servers (and all
# agents) concurrently — the k3s_server role's own guidance is to run HA
# clusters with --forks=1 to preserve quorum. Node-level plays get slower;
# localhost plays (terraform layers) are unaffected.
forks=1

inventory=./inventory/production
private_key_file=~/.ssh/h3xinfra_ansible_id
vault_password_file=./bin/h3xinfra-vault-pass
interpreter_python=auto_silent

# h3xinfra: keep this True. ssh_args in [ssh_connection] select the known_hosts
# file and the accept-new policy.
host_key_checking=True

# ---------------------------------------------------------------------------
# h3xinfra SSH transport tuning.
#
# - pipelining cuts each task from ~3 ssh ops to 1.
# - ControlMaster keeps one ssh process per host alive for ControlPersist, so
#   the ansible private key only has to be decrypted once per host. Combined
#   with ssh-agent (see scripts/h3xinfra-setup-ssh), a passphrase-protected
#   key is unlocked exactly once per dev-container session.
# - control_path lives under /tmp so the multiplexed socket is never placed
#   on the CIFS share (where 0777 mode + non-Unix semantics break it).
# - Host keys are checked against ~/.ssh/h3xinfra_known_hosts only.
#   accept-new records the key of a new host on first contact and refuses a
#   changed key. scripts/h3xinfra-setup-ssh seeds the file from the secrets
#   share when a pinned copy exists there. HashKnownHosts=no keeps the host
#   names readable, so each fingerprint can be checked against its node.
# ---------------------------------------------------------------------------
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o PreferredAuthentications=publickey -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/h3xinfra_known_hosts -o HashKnownHosts=no
control_path = /tmp/.ansible-ssh-%%h-%%p-%%r
retries = 3
