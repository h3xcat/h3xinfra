apiVersion: v1
kind: Secret
metadata:
  name: {{ include "h3xinfra-externaldns-pre.fullname" . }}-cloudflare-api-token
  labels:
    {{- include "h3xinfra-externaldns-pre.labels" . | nindent 4 }}
type: Opaque
data:
  api-token: {{ required "cloudflareApiToken.token is required" .Values.cloudflareApiToken.token | b64enc | quote }}
