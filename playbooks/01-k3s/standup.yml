---
# Secrets encryption cannot simply be switched on for a running cluster: k3s
# needs `k3s secrets-encrypt enable` on the first server BEFORE the servers
# restart with `secrets-encryption: true` (docs.k3s.io/cli/secrets-encrypt,
# "Enable Secrets Encryption on an Existing Cluster"). The orchestration below
# restarts every server, so this play fails closed: it passes only when k3s is
# not installed on the first server (a new cluster), or when
# `k3s secrets-encrypt status` succeeds and reports an encryption
# configuration, or when `k3s secrets-encrypt enable` already wrote the
# encryption configuration and the server has not restarted with
# secrets-encryption yet (status fails, and the node has no
# k3s.io/encryption-config-hash annotation). Any other result (no configuration
# file, k3s down, another error) stops the run before a server restarts.
- name: Check the secrets encryption precondition
  hosts: server
  gather_facts: false
  become: true
  vars:
    k3s_secrets_encryption_requested: >-
      {{ (server_config_yaml | default('{}') | from_yaml).get('secrets-encryption', false) | bool }}
    k3s_secrets_encryption_binary: /usr/local/bin/k3s
  tasks:
    - name: Check for the k3s binary on the first server
      ansible.builtin.stat:
        path: "{{ k3s_secrets_encryption_binary }}"
      register: k3s_secrets_encrypt_binary
      run_once: true
      delegate_to: "{{ groups['server'][0] }}"
      when: k3s_secrets_encryption_requested | bool

    # `k3s secrets-encrypt enable` writes this file. Until the servers restart
    # with secrets-encryption, `status` fails ("missing annotation on node" in
    # the server log): the node has no k3s.io/encryption-config-hash yet.
    - name: Check for the encryption configuration on the first server
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/cred/encryption-config.json
      register: k3s_secrets_encrypt_config
      run_once: true
      delegate_to: "{{ groups['server'][0] }}"
      when:
        - k3s_secrets_encryption_requested | bool
        - k3s_secrets_encrypt_binary.stat.exists

    - name: Read the secrets encryption status on the first server
      ansible.builtin.command:
        argv: ["{{ k3s_secrets_encryption_binary }}", secrets-encrypt, status]
      register: k3s_secrets_encrypt_status
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: "{{ groups['server'][0] }}"
      when:
        - k3s_secrets_encryption_requested | bool
        - k3s_secrets_encrypt_binary.stat.exists

    - name: Read the encryption hash annotation of the first server node
      ansible.builtin.shell: >-
        {{ k3s_secrets_encryption_binary }} kubectl get node "$(hostname)"
        -o jsonpath='{.metadata.annotations.k3s\.io/encryption-config-hash}'
      register: k3s_secrets_encrypt_annotation
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: "{{ groups['server'][0] }}"
      when:
        - k3s_secrets_encryption_requested | bool
        - k3s_secrets_encrypt_binary.stat.exists
        - k3s_secrets_encrypt_config.stat.exists | default(false)
        - k3s_secrets_encrypt_status.rc | default(0) != 0

    - name: Refuse to restart an existing cluster with secrets encryption before `k3s secrets-encrypt enable`
      ansible.builtin.assert:
        that: >-
          not k3s_secrets_encrypt_binary.stat.exists
          or (
            k3s_secrets_encrypt_status.rc | default(1) == 0
            and 'Encryption Status:' in (k3s_secrets_encrypt_status.stdout | default(''))
            and 'no configuration file found' not in
              ((k3s_secrets_encrypt_status.stdout | default('')) ~ (k3s_secrets_encrypt_status.stderr | default('')))
          )
          or (
            (k3s_secrets_encrypt_config.stat.exists | default(false))
            and k3s_secrets_encrypt_status.rc | default(0) != 0
            and k3s_secrets_encrypt_annotation.rc | default(1) == 0
            and (k3s_secrets_encrypt_annotation.stdout | default('x') | trim) == ''
          )
        fail_msg: >-
          server_config_yaml sets secrets-encryption, but `k3s secrets-encrypt status`
          on {{ groups['server'][0] }} did not report an encryption configuration
          (rc={{ k3s_secrets_encrypt_status.rc | default('n/a') }}:
          {{ ((k3s_secrets_encrypt_status.stdout | default('')) ~ ' ' ~ (k3s_secrets_encrypt_status.stderr | default(''))) | trim | truncate(300) }}).
          If k3s is down on that server, repair it first. If the status says
          "no configuration file found", run `k3s secrets-encrypt enable` on
          {{ groups['server'][0] }}. Then run this playbook again.
      run_once: true
      when: k3s_secrets_encryption_requested | bool

# Create kubelet configuration before K3s installation
- name: Create kubelet configuration
  hosts: k3s_cluster
  gather_facts: false
  become: true
  vars:
    # Values that the kubelet expects when protectKernelDefaults is set. With
    # the flag the kubelet does not change them; it refuses to start instead.
    kubelet_kernel_defaults:
      - {name: vm.overcommit_memory, value: "1"}
      - {name: vm.panic_on_oom, value: "0"}
      - {name: kernel.panic, value: "10"}
      - {name: kernel.panic_on_oops, value: "1"}
      - {name: kernel.keys.root_maxkeys, value: "1000000"}
      - {name: kernel.keys.root_maxbytes, value: "25000000"}
  tasks:
    # Checked first: an invalid kubelet_allowed_unsafe_sysctls stops the run on
    # every node before any node changes.
    - name: Check the kubelet unsafe sysctl allowlist
      ansible.builtin.import_tasks: tasks/kubelet-sysctls-check.yml

    - name: Create kubelet config directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
        state: directory
        mode: '0755'
        owner: root
        group: root

    # NOTE: kubelet's --config-dir (KEP-3983) only processes files with a
    # `.conf` extension — anything else in the directory is silently ignored
    # (k3s's own generated defaults live there as 00-k3s-defaults.conf).
    - name: Create kubelet configuration file for shutdown grace periods
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          shutdownGracePeriod: 90s
          shutdownGracePeriodCriticalPods: 30s
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-shutdown-grace-period.conf
        mode: '0644'
        owner: root
        group: root

    # Reserve resources for the OS + kubelet so a runaway pod can't starve
    # the node into NotReady. Reservations are subtracted from Allocatable,
    # leaving the kubelet itself with guaranteed headroom. The evictionHard
    # thresholds give the kubelet a margin to start evicting pods before
    # the OOM killer wakes up.
    #
    # Sizing rationale (8 worker-capable nodes, mix of 8–16 GiB):
    #   - 512Mi kube-reserved + 512Mi system-reserved = 1 GiB total reserved
    #   - On 8 GiB nodes this is ~12.5% — large enough for the kubelet,
    #     containerd, journald, and a buffer for log shippers.
    #   - On 16 GiB nodes the impact is ~6%, negligible.
    - name: Create kubelet configuration file for resource reservations
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          kubeReserved:
            cpu: "100m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"
          systemReserved:
            cpu: "100m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"
          evictionHard:
            memory.available: "200Mi"
            nodefs.available: "10%"
            imagefs.available: "10%"
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-resource-reservations.conf
        mode: '0644'
        owner: root
        group: root

    # Image GC thresholds. Kubelet's defaults (85/80) let unused images pile
    # up until the disk is 85% full, then only prune back down to 80% — on
    # small root disks that leaves the node permanently parked at 80%+ with
    # no headroom before disk-pressure eviction. Defaults here match upstream;
    # small-disk nodes lower them via inventory host vars so superseded image
    # versions are pruned continuously. Only unused images are ever removed.
    - name: Create kubelet configuration file for image GC thresholds
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          imageGCHighThresholdPercent: {{ kubelet_image_gc_high_threshold | default(85) }}
          imageGCLowThresholdPercent: {{ kubelet_image_gc_low_threshold | default(80) }}
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-image-gc.conf
        mode: '0644'
        owner: root
        group: root

    # Kubelet hardening, both opt-in (default false):
    #   kubelet_seccomp_default: containers without a seccomp profile get the
    #     container runtime's default profile instead of Unconfined. Only
    #     containers created after the kubelet restart are affected, and a
    #     workload that needs a blocked syscall fails, so enable it on one node
    #     first and recreate that node's pods before enabling it everywhere.
    #   kubelet_protect_kernel_defaults: the kubelet stops at start when a
    #     kernel tunable differs from kubelet_kernel_defaults, instead of
    #     silently changing it. The values are pinned in a sysctl.d file that
    #     sorts after every other file (so a boot cannot apply a different
    #     value) and are checked before the kubelet restarts.
    - name: Pin the kernel tunables that protectKernelDefaults requires
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/zz-h3xinfra-kubelet.conf
        state: present
        sysctl_set: true
        reload: true
      loop: "{{ kubelet_kernel_defaults }}"
      when: kubelet_protect_kernel_defaults | default(false) | bool

    # Rollback: remove the pin file. The live values stay as they are (they
    # are the values that the kubelet sets without protectKernelDefaults).
    - name: Remove the kernel tunable pin file when protectKernelDefaults is off
      ansible.builtin.file:
        path: /etc/sysctl.d/zz-h3xinfra-kubelet.conf
        state: absent
      when: not (kubelet_protect_kernel_defaults | default(false) | bool)

    - name: Read the live kernel tunables
      ansible.builtin.command:
        argv: "{{ ['sysctl', '-n'] + (kubelet_kernel_defaults | map(attribute='name') | list) }}"
      register: kubelet_kernel_live
      changed_when: false
      when: kubelet_protect_kernel_defaults | default(false) | bool

    - name: Refuse protectKernelDefaults when a live tunable differs from the kubelet value
      ansible.builtin.assert:
        that: kubelet_kernel_live.stdout_lines == (kubelet_kernel_defaults | map(attribute='value') | list)
        fail_msg: >-
          Live values {{ kubelet_kernel_live.stdout_lines }} do not match
          {{ kubelet_kernel_defaults }}. The kubelet would not start.
      when: kubelet_protect_kernel_defaults | default(false) | bool

    # Only options set to true are written: a "false" here would override the
    # k3s protect-kernel-defaults option in 00-k3s-defaults.conf. With both
    # options off, the file is removed.
    - name: Create kubelet configuration file for hardening options
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          {% if kubelet_seccomp_default | default(false) | bool %}
          seccompDefault: true
          {% endif %}
          {% if kubelet_protect_kernel_defaults | default(false) | bool %}
          protectKernelDefaults: true
          {% endif %}
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-hardening.conf
        mode: '0644'
        owner: root
        group: root
      when: (kubelet_seccomp_default | default(false) | bool) or (kubelet_protect_kernel_defaults | default(false) | bool)

    - name: Remove kubelet hardening file when both options are off
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-hardening.conf
        state: absent
      when: not (kubelet_seccomp_default | default(false) | bool) and not (kubelet_protect_kernel_defaults | default(false) | bool)

    # Unsafe sysctl allowlist (kubelet_allowed_unsafe_sysctls), the same file
    # that kubelet-sysctls.yml writes. No restart here: the K3s install below
    # restarts every node, so the kubelet loads the file then. A later run of
    # kubelet-sysctls.yml finds the list loaded and restarts nothing.
    - name: Write the kubelet unsafe sysctl allowlist
      ansible.builtin.import_tasks: tasks/kubelet-sysctls.yml

# Stop before K3s restarts if kube-proxy is disabled too early.
- name: Check the kube-proxy replacement settings
  import_playbook: kube-proxy-preflight.yml

# Opt-in containerd registry configuration (k3s_registries). It runs before
# the install, so a new node reads the file at its first start. On a running
# cluster it restarts only the nodes whose file changed, one at a time.
- name: Configure the containerd registries
  import_playbook: registries.yml

# Import the main k3s orchestration playbook
- import_playbook: k3s.orchestration.site

- import_playbook: kubelet-watchdog.yml

# Configure each apiserver after k3s starts, with one serial restart/readiness
# gate for authentication, admission and audit changes. No CNI is required yet.
- name: Configure kube-apiserver settings
  import_playbook: apiserver-config.yml
