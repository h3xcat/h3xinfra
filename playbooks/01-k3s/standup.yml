---
# Create kubelet configuration before K3s installation
- name: Create kubelet configuration
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tasks:
    - name: Create kubelet config directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
        state: directory
        mode: '0755'
        owner: root
        group: root

    # NOTE: kubelet's --config-dir (KEP-3983) only processes files with a
    # `.conf` extension — anything else in the directory is silently ignored
    # (k3s's own generated defaults live there as 00-k3s-defaults.conf).
    # These drop-ins were originally deployed as `.yaml` and therefore never
    # took effect; the cleanup task below removes the dead files.
    - name: Create kubelet configuration file for shutdown grace periods
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          shutdownGracePeriod: 90s
          shutdownGracePeriodCriticalPods: 30s
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-shutdown-grace-period.conf
        mode: '0644'
        owner: root
        group: root

    # Reserve resources for the OS + kubelet so a runaway pod can't starve
    # the node into NotReady. Reservations are subtracted from Allocatable,
    # leaving the kubelet itself with guaranteed headroom. The evictionHard
    # thresholds give the kubelet a margin to start evicting pods before
    # the OOM killer wakes up.
    #
    # Sizing rationale (8 worker-capable nodes, mix of 8–16 GiB):
    #   - 512Mi kube-reserved + 512Mi system-reserved = 1 GiB total reserved
    #   - On 8 GiB nodes this is ~12.5% — large enough for the kubelet,
    #     containerd, journald, and a buffer for log shippers.
    #   - On 16 GiB nodes the impact is ~6%, negligible.
    - name: Create kubelet configuration file for resource reservations
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          kubeReserved:
            cpu: "100m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"
          systemReserved:
            cpu: "100m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"
          evictionHard:
            memory.available: "200Mi"
            nodefs.available: "10%"
            imagefs.available: "10%"
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-resource-reservations.conf
        mode: '0644'
        owner: root
        group: root

    # Image GC thresholds. Kubelet's defaults (85/80) let unused images pile
    # up until the disk is 85% full, then only prune back down to 80% — on
    # small root disks that leaves the node permanently parked at 80%+ with
    # no headroom before disk-pressure eviction. Defaults here match upstream;
    # small-disk nodes lower them via inventory host vars so superseded image
    # versions are pruned continuously. Only unused images are ever removed.
    - name: Create kubelet configuration file for image GC thresholds
      ansible.builtin.copy:
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          imageGCHighThresholdPercent: {{ kubelet_image_gc_high_threshold | default(85) }}
          imageGCLowThresholdPercent: {{ kubelet_image_gc_low_threshold | default(80) }}
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-image-gc.conf
        mode: '0644'
        owner: root
        group: root

    - name: Remove ignored .yaml kubelet drop-ins (kubelet only reads .conf)
      ansible.builtin.file:
        path: "/var/lib/rancher/k3s/agent/etc/kubelet.conf.d/{{ item }}"
        state: absent
      loop:
      - 99-shutdown-grace-period.yaml
      - 99-resource-reservations.yaml
      - 99-image-gc.yaml

# Import the main k3s orchestration playbook
- import_playbook: k3s.orchestration.site

# Enable kube-apiserver OIDC trust (Keycloak) once the cluster is up. serial: 1
# with a per-node readiness gate, so a bad config only affects one server.
- import_playbook: apiserver-oidc.yml