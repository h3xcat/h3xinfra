---
# =============================================================================
# Containerd registry configuration (/etc/rancher/k3s/registries.yaml).
#
# Opt-in. Driven by the `k3s_registries` inventory var (group_vars/k3s_cluster):
#   state    present (default) or absent. absent deletes the file.
#   mirrors  registries.yaml `mirrors` (keys: endpoint, rewrite).
#   configs  registries.yaml `configs` (keys: auth, tls).
# When k3s_registries is not set or empty, this playbook changes nothing.
# Schema: https://docs.k3s.io/installation/private-registry
#
# K3s reads the file only when it starts, so a changed file needs a K3s
# restart. Servers restart first, then agents, one node at a time
# (serial: 1). Before a server restarts, the API server on every other server
# must be ready and every etcd node must be Ready and not cordoned, so one
# restart never costs etcd its quorum. No node restarts while kured holds its
# reboot lock. After each restart the play waits for /readyz (servers), the
# local kubelet and a node Ready status that the restarted kubelet posted.
# The play stops at the first failure, before it touches the next node.
#
# A stopped K3s (inactive) is never started or restarted. A failed or
# starting K3s stops the play. On a new node, K3s reads the file at its
# first start.
# =============================================================================
- name: Validate the k3s registry configuration
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars: &k3s_registries_vars
    k3s_registries_path: /etc/rancher/k3s/registries.yaml
    # Generated by K3s at every start; holds a copy of the credentials.
    k3s_registries_containerd_config: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
    # unmanaged: the variable is not set or empty, so the file is left alone.
    k3s_registries_state: >-
      {{ 'unmanaged' if not (k3s_registries | default(none)) else
         ((k3s_registries.get('state', 'present') if k3s_registries is mapping else 'present') | string) }}
    k3s_registries_unit_name: "{{ 'k3s' if inventory_hostname in groups.get('server', []) else 'k3s-agent' }}"
    # Messages name only keys and registries, never values, so the assert
    # below needs no no_log.
    k3s_registries_errors: >-
      {%- set ns = namespace(errors=[]) -%}
      {%- set r = k3s_registries | default(none) -%}
      {%- if not r -%}
      {%- elif r is not mapping -%}
        {%- set ns.errors = ns.errors + ['k3s_registries must be a mapping'] -%}
      {%- else -%}
        {%- for key in r if key not in ['state', 'mirrors', 'configs'] -%}
          {%- set ns.errors = ns.errors + ['unknown key k3s_registries.' ~ key] -%}
        {%- endfor -%}
        {%- set state = r.get('state', 'present') -%}
        {%- if state not in ['present', 'absent'] -%}
          {%- set ns.errors = ns.errors + ['k3s_registries.state must be present or absent'] -%}
        {%- elif state == 'present' and not (r.get('mirrors') or r.get('configs')) -%}
          {%- set ns.errors = ns.errors + ['k3s_registries needs mirrors or configs when state is present'] -%}
        {%- endif -%}
        {%- set mirrors = r.get('mirrors') or {} -%}
        {%- if mirrors is not mapping -%}
          {%- set ns.errors = ns.errors + ['k3s_registries.mirrors must be a mapping'] -%}
        {%- else -%}
          {%- for name, mirror in mirrors.items() -%}
            {%- if mirror is not mapping -%}
              {%- set ns.errors = ns.errors + ['k3s_registries.mirrors["' ~ name ~ '"] must be a mapping'] -%}
            {%- else -%}
              {%- for key in mirror if key not in ['endpoint', 'rewrite'] -%}
                {%- set ns.errors = ns.errors + ['unknown key k3s_registries.mirrors["' ~ name ~ '"].' ~ key] -%}
              {%- endfor -%}
              {%- set endpoints = mirror.get('endpoint') -%}
              {%- if endpoints is string or endpoints is mapping or endpoints is not iterable or endpoints | length == 0
                    or (endpoints | reject('string') | list | length) > 0
                    or (endpoints | map('trim') | reject | list | length) > 0 -%}
                {%- set ns.errors = ns.errors + ['k3s_registries.mirrors["' ~ name ~ '"].endpoint must be a list of URLs'] -%}
              {%- endif -%}
              {%- if mirror.get('rewrite') is not none and mirror.get('rewrite') is not mapping -%}
                {%- set ns.errors = ns.errors + ['k3s_registries.mirrors["' ~ name ~ '"].rewrite must be a mapping'] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set configs = r.get('configs') or {} -%}
        {%- if configs is not mapping -%}
          {%- set ns.errors = ns.errors + ['k3s_registries.configs must be a mapping'] -%}
        {%- else -%}
          {%- for name, config in configs.items() if config is not none -%}
            {%- set where = 'k3s_registries.configs["' ~ name ~ '"]' -%}
            {%- if config is not mapping -%}
              {%- set ns.errors = ns.errors + [where ~ ' must be a mapping'] -%}
            {%- else -%}
              {%- for key in config if key not in ['auth', 'tls'] -%}
                {%- set ns.errors = ns.errors + ['unknown key ' ~ where ~ '.' ~ key] -%}
              {%- endfor -%}
              {%- if 'auth' in config -%}
                {%- set auth = config['auth'] -%}
                {%- if auth is not mapping -%}
                  {%- set ns.errors = ns.errors + [where ~ '.auth must be a mapping'] -%}
                {%- else -%}
                  {%- for key in auth if key not in ['username', 'password', 'auth', 'identity_token'] -%}
                    {%- set ns.errors = ns.errors + ['unknown key ' ~ where ~ '.auth.' ~ key] -%}
                  {%- endfor -%}
                  {%- set filled = namespace(keys=[]) -%}
                  {%- for key in ['username', 'password', 'auth', 'identity_token'] -%}
                    {%- if auth.get(key) is not none and (auth.get(key) | string | trim | length) > 0 -%}
                      {%- set filled.keys = filled.keys + [key] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if ('username' in auth or 'password' in auth) and not ('username' in filled.keys and 'password' in filled.keys) -%}
                    {%- set ns.errors = ns.errors + [where ~ '.auth needs a non-empty username and password'] -%}
                  {%- elif filled.keys | length == 0 -%}
                    {%- set ns.errors = ns.errors + [where ~ '.auth needs username and password, auth or identity_token'] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
              {%- if 'tls' in config -%}
                {%- if config['tls'] is not mapping -%}
                  {%- set ns.errors = ns.errors + [where ~ '.tls must be a mapping'] -%}
                {%- else -%}
                  {%- for key in config['tls'] if key not in ['ca_file', 'cert_file', 'key_file', 'insecure_skip_verify'] -%}
                    {%- set ns.errors = ns.errors + ['unknown key ' ~ where ~ '.tls.' ~ key] -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endif -%}
      {{ ns.errors | join('; ') }}
    # Restart only when this run changed the file, or when an earlier run
    # changed it and then stopped before the restart: the file is newer than
    # the running K3s, or (state absent) the generated containerd
    # configuration still holds a credential. k3s_service_active and
    # k3s_service_started come from tasks/k3s-service-state.yml. The inputs
    # are all registered before the restart, so the value stays the same
    # during the restart tasks.
    k3s_registries_restart: >-
      {{ k3s_registries_state != 'unmanaged'
         and (k3s_service_active | default(false) | bool)
         and ((k3s_registries_written.changed | default(false) | bool)
              or (k3s_registries_removed.changed | default(false) | bool)
              or (k3s_registries_containerd_auth.stdout | default('0') | int) > 0
              or ((k3s_registries_stat.stat.exists | default(false) | bool)
                  and (k3s_registries_stat.stat.mtime | default(0) | int) > (k3s_service_started | default(0) | int))) }}
  tasks:
    - name: Check the k3s_registries variable
      ansible.builtin.assert:
        that: (k3s_registries_errors | trim | length) == 0
        fail_msg: "Invalid k3s_registries: {{ k3s_registries_errors | trim }}"
        quiet: true

    # The k3s.orchestration prereq role also writes registries.yaml from
    # registries_config_yaml, world-readable and without a restart. Only one
    # of the two may own the file.
    - name: Refuse registries_config_yaml when k3s_registries manages the file
      ansible.builtin.assert:
        that: registries_config_yaml is not defined
        fail_msg: >-
          Set either k3s_registries or registries_config_yaml, not both.
          Move the registries_config_yaml content into k3s_registries.
        quiet: true
      when: k3s_registries_state != 'unmanaged'

- name: Apply the registry configuration on servers, one at a time
  hosts: server
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  vars: *k3s_registries_vars
  tasks:
    - name: Apply the registry configuration
      ansible.builtin.import_tasks: tasks/registries.yml

- name: Apply the registry configuration on agents, one at a time
  hosts: agent
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  vars: *k3s_registries_vars
  tasks:
    - name: Apply the registry configuration
      ansible.builtin.import_tasks: tasks/registries.yml
