---
# Reads the state of the K3s service on this node. It is the first half of a
# guarded K3s restart; tasks/restart-k3s.yml is the second half. The caller
# decides between the two halves whether the node needs a restart, and that
# decision usually needs the facts set here.
#
# Input:
#   k3s_service_name  k3s on servers, k3s-agent on agents.
# Output (facts):
#   k3s_service_state    ActiveState of the unit, or unknown.
#   k3s_service_active   true when the unit is active.
#   k3s_service_started  Unix time (whole seconds) of the last start, or 0.
#
# A stopped K3s (inactive) passes: it is never started or restarted, and it
# reads its configuration at its next start. Any other state than active or
# inactive (failed, activating, ...) is a broken or changing K3s and stops the
# play before this node and before the next one.

- name: Read the K3s service state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --timestamp=unix
      - --property=ActiveState
      - --property=ActiveEnterTimestamp
      - "{{ k3s_service_name }}"
  register: k3s_service_show
  changed_when: false
  check_mode: false

# Whole seconds: systemd prints the start time in seconds.
- name: Record the K3s service state
  ansible.builtin.set_fact:
    k3s_service_state: >-
      {{ (k3s_service_show.stdout_lines | default([]) | select('match', '^ActiveState=')
          | first | default('ActiveState=unknown')).split('=', 1)[1] }}
    k3s_service_active: >-
      {{ (k3s_service_show.stdout_lines | default([]) | select('match', '^ActiveState=')
          | first | default('ActiveState=unknown')) == 'ActiveState=active' }}
    k3s_service_started: >-
      {{ ((k3s_service_show.stdout_lines | default([]) | select('match', '^ActiveEnterTimestamp=@[0-9]+$')
           | first | default('=@0')).split('@'))[1] | int }}

- name: Refuse a K3s service that is failing or changing state
  ansible.builtin.assert:
    that: k3s_service_state in ['active', 'inactive']
    fail_msg: >-
      {{ k3s_service_name }} on {{ inventory_hostname }} is
      {{ k3s_service_state }}. Repair it before you run this playbook again.
    quiet: true
