---
# Guarded restart of K3s on this node. Run it in a play with serial: 1 and
# max_fail_percentage: 0, servers first, then agents, after
# tasks/k3s-service-state.yml.
#
# Input:
#   k3s_service_name  k3s on servers, k3s-agent on agents.
#   k3s_restart       true to restart this node. The caller includes
#                     k3s_service_active in it: an inactive K3s is never
#                     started here. The value must not change during these
#                     tasks, so it must not depend on a result that is
#                     registered after the restart.
#
# Before a server restarts, the API server on every other server must be
# ready and every etcd node must be Ready and not cordoned, so one restart
# never costs etcd its quorum. No node restarts while kured holds its reboot
# lock. After the restart the tasks wait for /readyz (servers), the local
# kubelet and a node Ready status that the restarted kubelet posted.

# Losing a second etcd member while one is down breaks quorum. The K3s API
# server uses only its local etcd member, so /readyz on a server proves that
# its member serves with quorum. An unreachable server fails this task.
- name: Check that the API server on every other server is ready
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  delegate_to: "{{ item }}"
  loop: "{{ groups.get('server', []) | reject('equalto', inventory_hostname) | list }}"
  register: k3s_restart_peer_readyz
  changed_when: false
  check_mode: false
  failed_when: k3s_restart_peer_readyz.rc != 0 or (k3s_restart_peer_readyz.stdout | trim) != 'ok'
  when:
    - k3s_restart | bool
    - inventory_hostname in groups.get('server', [])

# Node Ready can stay True for about 50 seconds after a node fails, so this
# check adds to the /readyz check above. A cordoned etcd node is being
# drained or repaired. Nodes without the etcd role list nothing.
- name: Check that every etcd node is Ready and not cordoned
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - --selector=node-role.kubernetes.io/etcd=true
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name} {.status.conditions[?(@.type=="Ready")].status} {.spec.unschedulable}{"\n"}{end}'
  register: k3s_restart_etcd_nodes
  changed_when: false
  check_mode: false
  failed_when: >-
    k3s_restart_etcd_nodes.rc != 0
    or (k3s_restart_etcd_nodes.stdout_lines | reject('match', '^[^ ]+ True( false)? *$') | list | length) > 0
  when:
    - k3s_restart | bool
    - inventory_hostname in groups.get('server', [])

# kured sets this annotation on its DaemonSet while it drains or reboots a
# node, and for lock-release-delay after the node is back. Without kured,
# the list is empty.
- name: Check that kured is not rebooting a node
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - daemonsets
      - --all-namespaces
      - --selector=app.kubernetes.io/name=kured
      - -o
      - 'jsonpath={range .items[*]}{.metadata.namespace}/{.metadata.name}={.metadata.annotations.weave\.works/kured-node-lock}{"\n"}{end}'
  delegate_to: "{{ inventory_hostname if inventory_hostname in groups.get('server', []) else groups['server'][0] }}"
  register: k3s_restart_kured_lock
  changed_when: false
  check_mode: false
  failed_when: >-
    k3s_restart_kured_lock.rc != 0
    or (k3s_restart_kured_lock.stdout_lines | reject('match', '^[^=]+=$') | list | length) > 0
  when: k3s_restart | bool

- name: Read the node name
  ansible.builtin.command: hostname
  register: k3s_restart_node_name
  changed_when: false
  check_mode: false
  when: k3s_restart | bool

# The K3s units use TimeoutStartSec=0, so systemctl waits without a limit.
# The timeout fails this node instead of hanging the run.
- name: Restart K3s to load the new configuration
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: restarted
  timeout: 600
  when: k3s_restart | bool

# The Ready wait below needs a node status that the restarted kubelet
# posted. The kubelet runs inside this process, so a heartbeat later than its
# start time comes from the new kubelet.
- name: Read the start time of the restarted K3s
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --timestamp=unix
      - --property=ExecMainStartTimestamp
      - --value
      - "{{ k3s_service_name }}"
  register: k3s_restart_started_at
  changed_when: false
  failed_when: k3s_restart_started_at.rc != 0 or not (k3s_restart_started_at.stdout | trim) is match('^@[0-9]+$')
  when:
    - k3s_restart | bool
    - not ansible_check_mode

- name: Wait for the local kube-apiserver to report ready
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  register: k3s_restart_readyz
  changed_when: false
  retries: 40
  delay: 5
  until: k3s_restart_readyz.rc == 0 and 'ok' in k3s_restart_readyz.stdout
  when:
    - k3s_restart | bool
    - not ansible_check_mode
    - inventory_hostname in groups.get('server', [])

- name: Wait for the local kubelet to report healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:10248/healthz
    return_content: true
  register: k3s_restart_kubelet
  retries: 40
  delay: 5
  until: k3s_restart_kubelet.status == 200 and (k3s_restart_kubelet.content | trim) == 'ok'
  when:
    - k3s_restart | bool
    - not ansible_check_mode

# The Ready condition keeps its old value for about 50 seconds after the
# kubelet stops. Kubernetes writes the heartbeat in UTC with whole seconds,
# so a string comparison works. A heartbeat in a later second than the K3s
# start proves that the restarted kubelet posted it.
- name: Wait for the node to be Ready
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - node
      - "{{ k3s_restart_node_name.stdout | trim }}"
      - -o
      - 'jsonpath={.status.conditions[?(@.type=="Ready")].status} {.status.conditions[?(@.type=="Ready")].lastHeartbeatTime}'
  delegate_to: "{{ inventory_hostname if inventory_hostname in groups.get('server', []) else groups['server'][0] }}"
  vars:
    # Start of the restarted K3s in the format of a Kubernetes heartbeat.
    k3s_restart_started_at_utc: >-
      {{ '%Y-%m-%dT%H:%M:%SZ' | strftime((k3s_restart_started_at.stdout | default('@0') | trim)[1:] | int, utc=true) }}
  register: k3s_restart_node_ready
  changed_when: false
  retries: 40
  delay: 5
  until: >-
    k3s_restart_node_ready.rc == 0
    and (k3s_restart_node_ready.stdout.split() | length) == 2
    and k3s_restart_node_ready.stdout.split()[0] == 'True'
    and k3s_restart_node_ready.stdout.split()[1] > k3s_restart_started_at_utc
  when:
    - k3s_restart | bool
    - not ansible_check_mode
