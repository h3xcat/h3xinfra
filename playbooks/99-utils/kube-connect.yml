---
- name: Connect to K3s cluster
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: "~/.kube/config"
    # Override in the inventory with this cluster's API endpoint.
    expected_server_url: "{{ kube_api_server_url | default('https://kubernetes.example.com:443') }}"
    kubectl_argv: [kubectl, --kubeconfig, "{{ kubeconfig_path | expanduser }}"]
    server_query: [config, view, --minify, -o, "jsonpath={.clusters[0].cluster.server}"]
    allowed_server_urls: ["{{ expected_server_url }}", "https://127.0.0.1:6443"]
  tasks:
    - name: Require the kubeconfig shared by downstream deployment tools
      ansible.builtin.assert:
        that:
          - (kubeconfig_path | expanduser) == ('~/.kube/config' | expanduser)
          - lookup('ansible.builtin.env', 'KUBECONFIG') in ['', '~/.kube/config' | expanduser]
          - lookup('ansible.builtin.env', 'K8S_AUTH_KUBECONFIG') in ['', '~/.kube/config' | expanduser]
          - not lookup('ansible.builtin.env', 'K8S_AUTH_CONTEXT')
          - not lookup('ansible.builtin.env', 'HELM_KUBECONTEXT')
        fail_msg: >-
          This stack uses ~/.kube/config. Keep kubeconfig_path at that file.
          Unset KUBECONFIG and K8S_AUTH_KUBECONFIG unless they name its absolute
          path, and unset K8S_AUTH_CONTEXT and HELM_KUBECONTEXT.

    - name: Skip an already verified connection in this session
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['kube_connected'] | default(false)

    - name: Read the current context's server URL
      ansible.builtin.command:
        argv: "{{ kubectl_argv + server_query }}"
      register: server_url
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Probe the existing connection only for an allowed server
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['get', 'nodes', '-o', 'name'] }}"
      register: connection_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when: server_url.rc == 0 and server_url.stdout in allowed_server_urls

    - name: Configure a connection when the existing one is unavailable
      when: connection_probe.rc | default(1) != 0
      block:
        - name: Fetch kubeconfig from the first server
          become: true
          ansible.builtin.slurp:
            src: /etc/rancher/k3s/k3s.yaml
          delegate_to: "{{ groups['server'][0] }}"
          register: kubeconf_raw
          no_log: true

        - name: Create kubeconfig directory
          ansible.builtin.file:
            path: "{{ kubeconfig_path | expanduser | dirname }}"
            mode: "0755"
            state: directory

        - name: Save kubeconfig locally
          ansible.builtin.copy:
            content: "{{ kubeconf_raw.content | b64decode }}"
            dest: "{{ kubeconfig_path | expanduser }}"
            mode: "0600"
          no_log: true

        - name: Set the expected cluster endpoint
          ansible.builtin.command:
            argv: "{{ kubectl_argv + ['config', 'set-cluster', 'default', '--server=' ~ expected_server_url] }}"
          changed_when: true
          when: not ansible_check_mode

    # Check mode cannot verify a configuration that it did not write.
    - name: Verify the connection before caching success
      when: not ansible_check_mode
      block:
        - name: Verify the active context uses an allowed server
          ansible.builtin.command:
            argv: "{{ kubectl_argv + server_query }}"
          register: verified_server
          changed_when: false
          failed_when: verified_server.rc != 0 or verified_server.stdout not in allowed_server_urls

        - name: Verify cluster connectivity
          ansible.builtin.command:
            argv: "{{ kubectl_argv + ['get', 'nodes', '-o', 'name'] }}"
          changed_when: false

        - name: Cache the verified connection for subsequent playbooks
          ansible.builtin.set_fact:
            kube_connected: true
