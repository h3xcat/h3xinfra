---
- name: Configure unattended security upgrades
  hosts: k3s_cluster
  become: true
  gather_facts: false
  tasks:
    # Apply before apt can invoke needrestart for newly installed libraries.
    - name: Protect K3s from automatic package-triggered restarts
      ansible.builtin.import_tasks: tasks/needrestart.yml

    - name: Manage unattended-upgrades
      ansible.builtin.import_tasks: tasks/unattended-upgrades.yml
