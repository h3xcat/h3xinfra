---
- import_playbook: ../99-utils/kube-connect.yml

- name: Deploy Argo CD via Helm
  hosts: k8s
  gather_facts: false
  vars:
    # Opt-in KSOPS: SOPS/age decryption in kustomize builds (README, "KSOPS").
    # When it is disabled, argocd_ksops_active is empty. The Helm values then
    # fall back to their `default(...)`, which equals the chart default, so
    # the release renders exactly as without KSOPS.
    argocd_ksops_enabled: "{{ argocd.ksops.enabled | default(false) | bool }}"
    argocd_ksops_age_secret_name: "{{ argocd.ksops.age_secret_name | default('h3xinfra-argocd-sops-age') }}"
    argocd_ksops_active: "{{ argocd_ksops if (argocd_ksops_enabled | bool) else {} }}"
    argocd_ksops:
      # The bundled kustomize runs KSOPS as an exec KRM function.
      kustomize_build_options: --enable-alpha-plugins --enable-exec
      # Streamed uploads (`argocd app diff --server-side-generate --local`)
      # need only `applications, get`. With exec they would let any reader
      # run code in the repo-server. A limit of 0 rejects every upload.
      params:
        reposerver.streamed.manifest.max.tar.size: "0"
        reposerver.streamed.manifest.max.extracted.size: "0"
      # The repo-server does not call the Kubernetes API. Keep the token
      # away from programs that kustomizations run.
      automount_service_account_token: false
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /app/config/sops-age/keys.txt
      volumes:
        - name: ksops-tools
          emptyDir:
            sizeLimit: 256Mi
        # Not optional: without the key the pod does not start.
        - name: ksops-age-key
          secret:
            secretName: "{{ argocd_ksops_age_secret_name }}"
            optional: false
            items:
              - key: keys.txt
                path: keys.txt
      volumeMounts:
        - name: ksops-tools
          mountPath: /usr/local/bin/ksops
          subPath: ksops
          readOnly: true
        - name: ksops-age-key
          mountPath: /app/config/sops-age
          readOnly: true
      initContainers:
        # Copies only the ksops binary; Argo CD keeps its own kustomize.
        - name: install-ksops
          image: "quay.io/viaductoss/ksops:{{ image_versions.ksops }}"
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/ksops, install, /custom-tools]
          securityContext:
            # The image sets USER nonroot by name; restricted PSA needs the UID.
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi}
          volumeMounts:
            - name: ksops-tools
              mountPath: /custom-tools
  tasks:
    - name: Validate Argo CD configuration
      ansible.builtin.assert:
        that:
          - argocd is defined
          - argocd.namespace | default('') | length > 0
          - argocd.release_name_prefix | default('') | length > 0
          - argocd.hostname | default('') | length > 0
          - argocd.oidc.issuer | default('') is match('^https://')
          - argocd.oidc.client_id | default('') | length > 0
          - argocd.rbac.policy_csv | default('') | length > 0
          - argocd.gateway.name | default('') | length > 0
          - argocd.gateway.namespace | default('') | length > 0
          - argocd.gateway.section_name | default('') in ['https', 'https-app', 'https-apex']
        fail_msg: Configure the Argo CD hostname, HTTPS Gateway listener, Keycloak client and RBAC policy first.
        quiet: true

    - name: Add Argo Helm repository
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm
        state: present
        force_update: true
      changed_when: false

    # Pod Security: every Argo CD pod passes restricted.
    - name: Create Argo CD namespace
      kubernetes.core.k8s:
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ argocd.namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "{{ argocd.pod_security_enforce | default('restricted') }}"
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted

    # Fail before Helm with a clear message. A missing Secret or key would
    # otherwise leave the repo-server pod stuck in ContainerCreating.
    - name: Read the KSOPS age key Secret
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ argocd.namespace }}"
        name: "{{ argocd_ksops_age_secret_name }}"
      register: argocd_ksops_age_secret
      when: argocd_ksops_enabled | bool
      no_log: true

    # Keep only a boolean. The registered result holds the private key and
    # would otherwise stay in hostvars for the rest of the run.
    - name: Reduce the KSOPS age key Secret to a presence check
      ansible.builtin.set_fact:
        argocd_ksops_age_key_present: >-
          {{ (argocd_ksops_age_secret.resources | default([]) | length == 1)
             and ((argocd_ksops_age_secret.resources | default([{}]) | first).data | default({}))['keys.txt'] | default('') | length > 0 }}
        argocd_ksops_age_secret: {checked: true}
      when: argocd_ksops_enabled | bool
      no_log: true

    - name: Validate KSOPS configuration
      ansible.builtin.assert:
        that:
          - image_versions.ksops | default('') | length > 0
          - argocd_ksops_age_key_present | default(false) | bool
        fail_msg: >-
          KSOPS is enabled. Pin image_versions.ksops, and provision the Secret
          {{ argocd.namespace }}/{{ argocd_ksops_age_secret_name }} with the
          age identity in key keys.txt before you run this layer.
        quiet: true
      when: argocd_ksops_enabled | bool

    - name: Deploy Argo CD via Helm
      kubernetes.core.helm:
        name: "{{ argocd.release_name_prefix }}-main"
        chart_ref: argo/argo-cd
        chart_version: "{{ chart_versions.argocd }}"
        release_namespace: "{{ argocd.namespace }}"
        create_namespace: false
        values_files:
          - "{{ playbook_dir }}/argocd-values.yaml"
        values:
          fullnameOverride: "{{ argocd.release_name_prefix }}-main"
          global:
            domain: "{{ argocd.hostname }}"
          configs:
            cm:
              url: "https://{{ argocd.hostname }}"
              oidc.config: |
                name: Keycloak
                issuer: {{ argocd.oidc.issuer | to_json }}
                clientID: {{ argocd.oidc.client_id | to_json }}
                enablePKCEAuthentication: true
                requestedScopes: [openid, profile, email]
                requestedIDTokenClaims:
                  groups:
                    essential: true
              # An empty value is not rendered into argocd-cm.
              kustomize.buildOptions: "{{ argocd_ksops_active.kustomize_build_options | default('') }}"
            # KSOPS only; merged into argocd-values.yaml params.
            params: "{{ argocd_ksops_active.params | default({}) }}"
            rbac:
              policy.csv: "{{ argocd.rbac.policy_csv }}"
          # KSOPS only; the defaults are the chart defaults.
          repoServer:
            automountServiceAccountToken: "{{ argocd_ksops_active.automount_service_account_token | default(True) }}"
            serviceAccount:
              automountServiceAccountToken: "{{ argocd_ksops_active.automount_service_account_token | default(True) }}"
            env: "{{ argocd_ksops_active.env | default([]) }}"
            volumes: "{{ argocd_ksops_active.volumes | default([]) }}"
            volumeMounts: "{{ argocd_ksops_active.volumeMounts | default([]) }}"
            initContainers: "{{ argocd_ksops_active.initContainers | default([]) }}"
          server:
            httproute:
              enabled: true
              hostnames:
                - "{{ argocd.hostname }}"
              parentRefs:
                - name: "{{ argocd.gateway.name }}"
                  namespace: "{{ argocd.gateway.namespace }}"
                  sectionName: "{{ argocd.gateway.section_name }}"
          # The upstream server policy allows every source. Replace it with
          # this policy; policies are additive, so that policy MUST stay off.
          extraObjects:
            # The chart's default-deny policy also depends on global.create,
            # so supply it here alongside the replacement server policy.
            - apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: "{{ argocd.release_name_prefix }}-main-default-deny"
                namespace: "{{ argocd.namespace }}"
              spec:
                podSelector: {}
                policyTypes: [Ingress]
            - apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: "{{ argocd.release_name_prefix }}-main-server-gateway"
                namespace: "{{ argocd.namespace }}"
              spec:
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-server
                    app.kubernetes.io/instance: "{{ argocd.release_name_prefix }}-main"
                policyTypes: [Ingress]
                ingress:
                  - from:
                      - namespaceSelector:
                          matchLabels:
                            kubernetes.io/metadata.name: "{{ argocd.gateway.namespace }}"
                        podSelector:
                          matchLabels:
                            gateway.envoyproxy.io/owning-gateway-name: "{{ argocd.gateway.name }}"
                            gateway.envoyproxy.io/owning-gateway-namespace: "{{ argocd.gateway.namespace }}"
                    ports:
                      - protocol: TCP
                        port: 8080
        state: present
        wait: true
        # Includes CRDs, the Redis credential hook and initial image pulls.
        timeout: 600s
      no_log: true
