---
- import_playbook: ../99-utils/kube-connect.yml

- name: Deploy Argo CD via Helm
  hosts: k8s
  gather_facts: false
  tasks:
    - name: Validate Argo CD configuration
      ansible.builtin.assert:
        that:
          - argocd is defined
          - argocd.namespace | default('') | length > 0
          - argocd.release_name_prefix | default('') | length > 0
          - argocd.hostname | default('') | length > 0
          - argocd.oidc.issuer | default('') is match('^https://')
          - argocd.oidc.client_id | default('') | length > 0
          - argocd.rbac.policy_csv | default('') | length > 0
          - argocd.gateway.name | default('') | length > 0
          - argocd.gateway.namespace | default('') | length > 0
          - argocd.gateway.section_name | default('') in ['https', 'https-app', 'https-apex']
          # A list of CIDRs; a plain string fails here because its characters do not match.
          - argocd.server_allowed_cidrs | default([], true) | reject('match', '^[0-9A-Fa-f.:]+/[0-9]{1,3}$') | list | length == 0
        fail_msg: Configure the Argo CD hostname, HTTPS Gateway listener, Keycloak client, RBAC policy and allowed client CIDR list first.
        quiet: true

    - name: Add Argo Helm repository
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm
        state: present
        force_update: true
      changed_when: false

    # Pod Security: every Argo CD pod passes restricted.
    - name: Create Argo CD namespace
      kubernetes.core.k8s:
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ argocd.namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "{{ argocd.pod_security_enforce | default('restricted') }}"
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted

    # Optional source gate on the server HTTPRoute: Envoy answers 403 to every
    # client outside argocd.server_allowed_cidrs. An empty list deletes the
    # policy; Argo CD login is then the only gate. A separate task keeps the
    # Helm values plain YAML for the render tests. It runs before Helm, so a
    # new route never starts ungated, and teardown keeps it.
    - name: Restrict the Argo CD server route to the allowed client CIDRs
      kubernetes.core.k8s:
        state: "{{ 'present' if argocd.server_allowed_cidrs | default([], true) | length > 0 else 'absent' }}"
        definition:
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          metadata:
            name: "{{ argocd.release_name_prefix }}-main-server"
            namespace: "{{ argocd.namespace }}"
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: "{{ argocd.release_name_prefix }}-main-server"
            authorization:
              defaultAction: Deny
              rules:
                - action: Allow
                  principal:
                    clientCIDRs: "{{ argocd.server_allowed_cidrs | default([], true) }}"

    - name: Deploy Argo CD via Helm
      kubernetes.core.helm:
        name: "{{ argocd.release_name_prefix }}-main"
        chart_ref: argo/argo-cd
        chart_version: "{{ chart_versions.argocd }}"
        release_namespace: "{{ argocd.namespace }}"
        create_namespace: false
        values_files:
          - "{{ playbook_dir }}/argocd-values.yaml"
        values:
          fullnameOverride: "{{ argocd.release_name_prefix }}-main"
          global:
            domain: "{{ argocd.hostname }}"
          configs:
            cm:
              url: "https://{{ argocd.hostname }}"
              oidc.config: |
                name: Keycloak
                issuer: {{ argocd.oidc.issuer | to_json }}
                clientID: {{ argocd.oidc.client_id | to_json }}
                enablePKCEAuthentication: true
                requestedScopes: [openid, profile, email]
                requestedIDTokenClaims:
                  groups:
                    essential: true
            rbac:
              policy.csv: "{{ argocd.rbac.policy_csv }}"
          server:
            httproute:
              enabled: true
              hostnames:
                - "{{ argocd.hostname }}"
              parentRefs:
                - name: "{{ argocd.gateway.name }}"
                  namespace: "{{ argocd.gateway.namespace }}"
                  sectionName: "{{ argocd.gateway.section_name }}"
          # The chart's default Redis tag trails the Redis patch releases.
          # The repository stays the chart's. The tag is set here because
          # argocd-values.yaml cannot read a variable.
          redis:
            image:
              tag: "{{ image_versions.argocd_redis }}"
          # The upstream server policy allows every source. Replace it with
          # this policy; policies are additive, so that policy MUST stay off.
          extraObjects:
            # The chart's default-deny policy also depends on global.create,
            # so supply it here alongside the replacement server policy.
            - apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: "{{ argocd.release_name_prefix }}-main-default-deny"
                namespace: "{{ argocd.namespace }}"
              spec:
                podSelector: {}
                policyTypes: [Ingress]
            - apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: "{{ argocd.release_name_prefix }}-main-server-gateway"
                namespace: "{{ argocd.namespace }}"
              spec:
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-server
                    app.kubernetes.io/instance: "{{ argocd.release_name_prefix }}-main"
                policyTypes: [Ingress]
                ingress:
                  - from:
                      - namespaceSelector:
                          matchLabels:
                            kubernetes.io/metadata.name: "{{ argocd.gateway.namespace }}"
                        podSelector:
                          matchLabels:
                            gateway.envoyproxy.io/owning-gateway-name: "{{ argocd.gateway.name }}"
                            gateway.envoyproxy.io/owning-gateway-namespace: "{{ argocd.gateway.namespace }}"
                    ports:
                      - protocol: TCP
                        port: 8080
        state: present
        wait: true
        # Includes CRDs, the Redis credential hook and initial image pulls.
        timeout: 600s
      no_log: true
