---
# Stops here unless run with -e confirm_destroy=yes-destroy-data.
- name: Require confirmation before teardown
  import_playbook: ../99-utils/confirm-destroy.yml

- import_playbook: ../99-utils/kube-connect.yml

- name: Remove MetalLB via Helm
  hosts: k8s
  gather_facts: false

  tasks:
  - name: Uninstall MetalLB via Helm
    kubernetes.core.helm:
      name: "{{ metallb.release_name_prefix }}-main"
      namespace: "{{ metallb.namespace }}"
      state: absent
      wait: true
      timeout: "300s"

  - name: Remove MetalLB namespace
    kubernetes.core.k8s:
      api_version: v1
      kind: Namespace
      name: "{{ metallb.namespace }}"
      state: absent
      wait: true
      wait_timeout: 300
