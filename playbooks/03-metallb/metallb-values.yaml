# Configuration for MetalLB Helm chart
# Reference: https://metallb.universe.tf/installation/
# Reference: https://github.com/metallb/metallb/tree/main/charts/metallb

controller:
  enabled: true
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi

speaker:
  enabled: true
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi
  frr:
    enabled: false
  # Enable IPv6 support in the speaker component
  tolerateMaster: true
  nodeSelector: {}
  affinity: {}
  # Allow IPv6 traffic through MetalLB
  extraEnv:
    - name: METALLB_ML_BIND_DUAL_STACK
      value: "true"

frr-k8s:
  frrk8s:
    # The bundled chart also uses this block for its status-cleaner Deployment.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 32Mi
      limits:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 256Mi
    frr:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
          ephemeral-storage: 1Gi
    frrMetrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
          ephemeral-storage: 256Mi
    frrStatus:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 250m
          memory: 256Mi
          ephemeral-storage: 256Mi
    reloader:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 256Mi

rbac:
  create: true

# Enable CRDs - MetalLB now uses custom resources instead of configInline
crds:
  enabled: true

# configInline is removed as it's deprecated
# Configuration will be applied using separate IPAddressPool and L2Advertisement/BGPAdvertisement CRs
