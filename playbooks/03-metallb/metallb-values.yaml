# Configuration for MetalLB Helm chart
# Reference: https://metallb.universe.tf/installation/
# Reference: https://github.com/metallb/metallb/tree/main/charts/metallb
# Resource completeness is checked by h3xinfra-private/tests/helm against the
# pinned chart. Only the controller and L2 speaker are deployed.

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi

speaker:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi
  frr:
    enabled: false

# L2 announcements need neither the bundled nor legacy FRR backend.
frrk8s:
  enabled: false
