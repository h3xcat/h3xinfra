---
- import_playbook: ../99-utils/kube-connect.yml
- name: Deploy MetalLB via Helm
  hosts: k8s
  gather_facts: false

  tasks:
  - name: Add MetalLB Helm repository
    kubernetes.core.helm_repository:
      name: metallb
      repo_url: https://metallb.github.io/metallb
      state: present
      force_update: true
    changed_when: false

  # Pod Security: privileged. The L2 speaker uses hostNetwork and NET_RAW
  # for ARP/NDP announcements; no FRR backend is deployed.
  - name: Create MetalLB namespace
    kubernetes.core.k8s:
      state: present
      wait: true
      definition:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: "{{ metallb.namespace }}"
          labels:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted

  - name: Deploy MetalLB via Helm
    kubernetes.core.helm:
      name: "{{ metallb.release_name_prefix }}-main"
      chart_ref: "metallb/metallb"
      chart_version: "{{ chart_versions.metallb }}"
      namespace: "{{ metallb.namespace }}"
      create_namespace: false
      values_files: 
      - "{{ playbook_dir }}/metallb-values.yaml"
      state: present
      wait: true
      # The speaker DaemonSet rolls one node at a time, and the Pis are slow
      # to pull and start it: an upgrade needs several minutes. With
      # 120s, helm marked the release `failed` although the rollout completed.
      timeout: "600s"
