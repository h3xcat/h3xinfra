---
- import_playbook: ../99-utils/kube-connect.yml

- name: Deploy Longhorn via Helm
  hosts: k8s
  gather_facts: true
  vars:
  tasks:
    # The post chart renders only the OIDC filter and the IP allowlist. An
    # unknown method (for example the old "basic") would render no
    # authentication. This check is the first task, so a bad value stops the
    # play before it changes the cluster.
    - name: Validate Longhorn auth method
      ansible.builtin.assert:
        that:
          - (longhorn.auth.method | default('none')) in ['none', 'oauth2_proxy']
        fail_msg: >-
          longhorn.auth.method must be "oauth2_proxy" or "none"
          (got "{{ longhorn.auth.method | default('none') }}").
          Basic auth is not supported.

    - name: Check whether Longhorn volume CRDs already exist
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: volumes.longhorn.io
      register: longhorn_volume_crd

    - name: Check whether Longhorn instance manager CRDs already exist
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: instancemanagers.longhorn.io
      register: longhorn_instance_manager_crd

    - name: Require complete Longhorn APIs before changing the V2 setting
      ansible.builtin.assert:
        that:
          - longhorn_volume_crd.api_found | default(false)
          - longhorn_instance_manager_crd.api_found | default(false)
          - longhorn_volume_crd.resources | length == longhorn_instance_manager_crd.resources | length
        fail_msg: >-
          Cannot establish whether V2 is unused: the Longhorn APIs are unavailable
          or partly installed. Restore API access and investigate before proceeding.

    - name: Verify the V2 data engine is unused before disabling it
      when: longhorn_volume_crd.resources | length > 0
      block:
        - name: Read existing Longhorn volumes
          kubernetes.core.k8s_info:
            api_version: longhorn.io/v1beta2
            kind: Volume
            namespace: "{{ longhorn.namespace }}"
          register: longhorn_existing_volumes

        - name: Refuse to disable V2 while any V2 volume exists
          ansible.builtin.assert:
            that:
              - longhorn_existing_volumes.api_found | default(false)
              - longhorn_existing_volumes.resources | selectattr('spec.dataEngine', 'equalto', 'v2') | list | length == 0
            fail_msg: >-
              V2 volumes exist. Stop and plan their migration separately before
              using this V2-disabled configuration; this play never detaches or deletes them.
            quiet: true

        - name: Read existing Longhorn instance managers
          kubernetes.core.k8s_info:
            api_version: longhorn.io/v1beta2
            kind: InstanceManager
            namespace: "{{ longhorn.namespace }}"
          register: longhorn_existing_instance_managers

        - name: Require successful instance manager discovery
          ansible.builtin.assert:
            that: longhorn_existing_instance_managers.api_found | default(false)
            fail_msg: Cannot inspect Longhorn instance managers; refusing to change V2.

        - name: Refuse to disable V2 while its instance managers contain processes
          ansible.builtin.assert:
            that:
              - item.status.instanceEngines | default({}) | length == 0
              - item.status.instanceEngineFrontends | default({}) | length == 0
              - item.status.instanceReplicas | default({}) | length == 0
              - item.status.instanceShards | default({}) | length == 0
              - item.status.instanceShardGroups | default({}) | length == 0
            fail_msg: >-
              V2 instance manager {{ item.metadata.name }} still owns processes.
              Investigate before disabling V2; do not force-delete its Pod.
            quiet: true
          loop: "{{ longhorn_existing_instance_managers.resources | selectattr('spec.dataEngine', 'equalto', 'v2') | list }}"
          loop_control:
            label: "{{ item.metadata.name }}"

    - name: Add Longhorn Helm repository
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io
        state: present
        force_update: true
      changed_when: false

    # Pod Security: privileged. longhorn-manager and the instance managers
    # are privileged and mount /dev, /proc and /var/lib/longhorn from the host.
    - name: Create Longhorn namespace
      kubernetes.core.k8s:
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ longhorn.namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted

    - name: Deploy Longhorn pre-configuration via Helm
      kubernetes.core.helm:
        name: "{{ longhorn.release_name_prefix }}-pre"
        chart_ref: "{{ playbook_dir }}/charts/h3xinfra-longhorn-pre"
        namespace: "{{ longhorn.namespace }}"
        create_namespace: false
        values:
          fullnameOverride: "{{ longhorn.release_name_prefix }}-pre"
          longhornCifsSecret:
            cifsUsername: "{{ longhorn.cifs_username }}"
            cifsPassword: "{{ longhorn.cifs_password }}"
        state: present
        wait: true
        timeout: "120s"
      no_log: true

    - name: Deploy Longhorn via Helm
      kubernetes.core.helm:
        name: "{{ longhorn.release_name_prefix }}-main"
        chart_ref: "longhorn/longhorn"
        chart_version: "{{ chart_versions.longhorn }}"
        namespace: "{{ longhorn.namespace }}"
        create_namespace: false
        values: 
          longhornManager:
            resources:
              requests:
                cpu: "1"
                memory: 3Gi
              limits:
                cpu: "4"
                memory: 8Gi
            updateStrategy:
              rollingUpdate:
                maxUnavailable: 1
          longhornGlobalManager:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
          defaultSettings:
            # The native setting accepts a JSON string, not a YAML mapping.
            systemManagedCSIComponentsResourceLimits: >-
              {
                "csi-attacher": {
                  "requests": {"cpu": "50m", "memory": "64Mi", "ephemeral-storage": "32Mi"},
                  "limits": {"cpu": "500m", "memory": "256Mi", "ephemeral-storage": "256Mi"}
                },
                "csi-provisioner": {
                  "requests": {"cpu": "50m", "memory": "64Mi", "ephemeral-storage": "32Mi"},
                  "limits": {"cpu": "500m", "memory": "256Mi", "ephemeral-storage": "256Mi"}
                },
                "csi-resizer": {
                  "requests": {"cpu": "50m", "memory": "64Mi", "ephemeral-storage": "32Mi"},
                  "limits": {"cpu": "500m", "memory": "256Mi", "ephemeral-storage": "256Mi"}
                },
                "csi-snapshotter": {
                  "requests": {"cpu": "50m", "memory": "64Mi", "ephemeral-storage": "32Mi"},
                  "limits": {"cpu": "500m", "memory": "256Mi", "ephemeral-storage": "256Mi"}
                },
                "longhorn-csi-plugin": {
                  "requests": {"cpu": "100m", "memory": "128Mi", "ephemeral-storage": "32Mi"},
                  "limits": {"cpu": "1", "memory": "512Mi", "ephemeral-storage": "256Mi"}
                },
                "node-driver-registrar": {
                  "requests": {"cpu": "25m", "memory": "32Mi", "ephemeral-storage": "32Mi"},
                  "limits": {"cpu": "250m", "memory": "128Mi", "ephemeral-storage": "256Mi"}
                },
                "longhorn-liveness-probe": {
                  "requests": {"cpu": "25m", "memory": "32Mi", "ephemeral-storage": "32Mi"},
                  "limits": {"cpu": "250m", "memory": "128Mi", "ephemeral-storage": "256Mi"}
                }
              }
            # Storage Configuration
            defaultDataPath: /var/lib/longhorn/
            storageMinimalAvailablePercentage: 10
            storageOverProvisioningPercentage: 200
            storageReservedPercentageForDefaultDisk: 5

            # Performance Optimization
            # 3 replicas tolerates one node loss during rebuild — needed
            # because the cluster has 8 worker-capable nodes and the
            # default-2 setting was inconsistent with the actual fleet
            # state (every volume was manually bumped to 3 over time).
            defaultReplicaCount: 3
            defaultDataLocality: best-effort
            replicaAutoBalance: least-effort

            # High Availability and Resilience
            replicaSoftAntiAffinity: "false"
            allowVolumeCreationWithDegradedAvailability: "false"
            rwxVolumeFastFailover: "true"
            # A failed node is not proof that its old writer stopped. Require
            # attended recovery before removing Pods or reattaching their data.
            nodeDownPodDeletionPolicy: do-nothing
            concurrentAutomaticEngineUpgradePerNodeLimit: 0
            # Drain compatibility for kured + manual kubectl drain.
            #
            # `block-for-eviction-if-contains-last-replica`: when a node is
            # cordoned for drain, if it holds the last healthy replica of any
            # volume, Longhorn ACTIVELY evicts that replica (rebuilds it on
            # another node) and only then lifts the instance-manager PDB so the
            # drain can complete. Replicas that already have healthy copies
            # elsewhere are not rebuilt — only the at-risk ones move.
            #
            # We previously used `block-if-contains-last-replica`, which only
            # *blocks* and never relocates. That deadlocked kured: during a
            # back-to-back rolling reboot of several storage nodes, replicas on
            # the just-rebooted nodes were still rebuilding, so the next node to
            # drain genuinely held the last healthy replica of some volume. The
            # instance-manager PDB then refused eviction indefinitely and kured
            # ground on the un-evictable pod until it crashed mid-drain, leaving
            # the node cordoned forever and the volume stuck faulted.
            nodeDrainPolicy: block-for-eviction-if-contains-last-replica

            # Orphan cleanup. Longhorn refuses to lift a node's instance-manager
            # PDB while ANY engine/replica process still runs inside it -- stale
            # ones included, whose CR long since moved to another node (RWX
            # fast-failover during an API/etcd blip leaves exactly that behind).
            # 2026-09-11..13: two orphaned RWX engines on h3xsrv03 blocked kured's
            # drain for 50 hours; Longhorn had created Orphan CRs for them on
            # 09-09 but nothing ever acted on them because this was unset.
            # `instance` deletes orphaned engine/replica *processes* after the
            # grace period. Deliberately NOT `replica-data`: that purges on-disk
            # replica directories that have no Replica CR, i.e. the manual
            # salvage safety net. Orphans on down/unknown nodes are still not
            # auto-cleaned -- `kubectl -n longhorn-system get orphans.longhorn.io`.
            orphanResourceAutoDeletion: "instance"
            orphanResourceAutoDeletionGracePeriod: "300"

            # Preserve live reservations; the former lowercase Cpu key was ignored.
            guaranteedInstanceManagerCPU:
              v1: "12"
              v2: "31"

            # V2 and dedicated block disks are parked. Re-enabling requires a new
            # storage design and prerequisites; there is no inventory opt-in.
            v2DataEngine: false

            # Backup and Maintenance
            createDefaultDiskLabeledNodes: "false"
          defaultBackupStore:
            backupTarget: "{{ longhorn.cifs_backup_target }}"
            backupTargetCredentialSecret: "{{ longhorn.release_name_prefix }}-pre-cifs-secret"
          # Expose longhorn-manager metrics (:9500, longhorn_volume_robustness,
          # longhorn_engine_replica_mode, ...) to kube-prometheus-stack via the
          # chart's ServiceMonitor. The upstream `longhorn-manager` NetworkPolicy
          # (restrictInternalTraffic) only admits Longhorn components, so the
          # h3xinfra-longhorn-post chart adds the ingress rule for Prometheus.
          # Bootstrap note: the ServiceMonitor CRD comes from the 22-monitoring
          # layer, which must exist before this layer on a from-scratch standup.
          metrics:
            serviceMonitor:
              enabled: true

        state: present
        wait: true
        # A version bump rolls the longhorn-manager DaemonSet (image pulls +
        # one restart per node), which routinely overruns 120s on this fleet.
        timeout: "600s"

    - name: Verify the V2 data engine has stopped after disabling it
      when: not ansible_check_mode
      block:
        - name: Wait for the native V2 setting to be disabled
          kubernetes.core.k8s_info:
            api_version: longhorn.io/v1beta2
            kind: Setting
            name: v2-data-engine
            namespace: "{{ longhorn.namespace }}"
          register: longhorn_v2_setting
          until:
            - longhorn_v2_setting.resources | length == 1
            - longhorn_v2_setting.resources[0].value == 'false'
          retries: 60
          delay: 5

        - name: Wait for unused V2 instance managers to disappear
          kubernetes.core.k8s_info:
            api_version: longhorn.io/v1beta2
            kind: InstanceManager
            namespace: "{{ longhorn.namespace }}"
          register: longhorn_remaining_instance_managers
          until: >-
            (longhorn_remaining_instance_managers.api_found | default(false)) and
            (longhorn_remaining_instance_managers.resources | selectattr('spec.dataEngine', 'equalto', 'v2') | list | length == 0)
          retries: 60
          delay: 5

    - name: Validate Longhorn OIDC configuration
      ansible.builtin.assert:
        that:
          - longhorn.auth.oauth2_proxy.oidc_issuer_url | default('') | length > 0
          - longhorn.auth.oauth2_proxy.client_id     | default('') | length > 0
          - longhorn.auth.oauth2_proxy.client_secret | default('') | length > 0
        fail_msg: >-
          longhorn.auth.method == 'oauth2_proxy' requires
          longhorn.auth.oauth2_proxy.{oidc_issuer_url,client_id,client_secret}
          to all be set.
      when: (longhorn.auth.method | default('none')) == 'oauth2_proxy'

    # The Helm task below runs with no_log, so it hides the chart guard
    # message. Check the same rule here with a readable message.
    - name: Validate Longhorn trusted_ips against the auth method
      ansible.builtin.assert:
        that:
          - >-
            (longhorn.auth.method | default('none')) == 'oauth2_proxy' or
            (longhorn.trusted_ips | default([], true) | map('trim') | select('search', '/0$') | list | length == 0)
        fail_msg: >-
          longhorn.trusted_ips contains a world CIDR (0.0.0.0/0 or ::/0), but
          longhorn.auth.method is not 'oauth2_proxy'. This publishes the
          Longhorn UI without authentication. Set auth.method to
          'oauth2_proxy' or use LAN CIDRs.

    - name: Deploy Longhorn configuration via Helm
      kubernetes.core.helm:
        name: "{{ longhorn.release_name_prefix }}-post"
        chart_ref: "{{ playbook_dir }}/charts/h3xinfra-longhorn-post"
        namespace: "{{ longhorn.namespace }}"
        create_namespace: false
        values:
          fullnameOverride: "{{ longhorn.release_name_prefix }}-post"
          longhornIngress:
            host: "{{ longhorn.ingress_host }}"
            gateway:
              name: "{{ gateway.release_name_prefix }}-pre-shared"
              namespace: "{{ gateway.namespace }}"
            trustedIPs: "{{ longhorn.trusted_ips }}"
            oidc:
              enabled: "{{ (longhorn.auth.method | default('none')) == 'oauth2_proxy' }}"
              issuerUrl: "{{ longhorn.auth.oauth2_proxy.oidc_issuer_url | default('') }}"
              clientId: "{{ longhorn.auth.oauth2_proxy.client_id | default('') }}"
              clientSecret: "{{ longhorn.auth.oauth2_proxy.client_secret | default('') }}"
              secretRef:
                name: "{{ longhorn.release_name_prefix }}-oidc"
        set_values:
          # `jobs` is a list of dicts; pass through to_json so Helm gets
          # native YAML/JSON instead of an Ansible-stringified list.
          - value: "recurringJobs.jobs={{ longhorn.recurring_jobs.jobs | default([]) | to_json }}"
            value_type: json
        state: present
        wait: true
        timeout: "120s"
      no_log: true
