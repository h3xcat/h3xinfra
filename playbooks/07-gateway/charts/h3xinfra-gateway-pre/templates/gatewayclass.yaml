---
# EnvoyProxy customization: applied to Envoy Gateway-managed Service so that
# MetalLB picks the right pool and the LB advertises both IPv4 and IPv6.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "h3xinfra-gateway-pre.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h3xinfra-gateway-pre.labels" . | nindent 4 }}
spec:
  # Bind the proxy's Gateway listeners dual-stack. Envoy Gateway defaults to
  # IPv4-only listeners ("IPv6 and dual-stack environments are not supported
  # in this default configuration"), so without this the pod RSTs the IPv6
  # connections the LoadBalancer VIP DNATs to it.
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      # Run the data plane with more than one replica, spread across nodes,
      # so a single node drain/reboot does not take every route (and every
      # OIDC login) down with it (2026-09-13: the lone proxy on h3xsrv01 went
      # with the node). MetalLB L2 + externalTrafficPolicy=Local announces the
      # VIP from one endpoint node at a time, so the extra replica is a hot
      # standby that shrinks the outage to the L2 re-announce. Deliberately no
      # PodDisruptionBudget: with kured concurrency 1, a PDB-protected replica
      # stuck on a dead node would block every other node's drain.
      envoyDeployment:
        replicas: {{ .Values.gateway.proxy.replicas }}
        pod:
          affinity:
            # Prefer the MS-01 servers (10 GbE, amd64) but stay schedulable on
            # the Pi agents when a server is drained; MetalLB L2 announces the
            # VIP from whichever endpoint node it picks, so a proxy on a Pi
            # would put all ingress behind a 1 GbE port.
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values: ["amd64"]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      gateway.envoyproxy.io/owning-gateway-name: {{ include "h3xinfra-gateway-pre.gatewayName" . }}
                      gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
      envoyService:
        annotations:
          metallb.universe.tf/address-pool: {{ include "h3xinfra-gateway-pre.fullname" . }}-pool
          {{- with .Values.gateway.serviceAnnotations }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        externalTrafficPolicy: Local
        # ipFamilies / ipFamilyPolicy aren't first-class fields in EnvoyProxy
        # v1alpha1, and Kubernetes defaults a Service to SingleStack (IPv4), so
        # without this patch the pool's IPv6 VIP is never allocated: the public
        # AAAA record points at an address no node announces and dual-stack
        # clients that dial IPv6 first (including Envoy Gateway's own OIDC
        # discovery fetch) black-hole. Request both families explicitly,
        # mirroring the mailu external Service.
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilyPolicy: PreferDualStack
              ipFamilies:
                - IPv4
                - IPv6
  telemetry:
    metrics:
      # Envoy proxy exposes Prometheus metrics on :19001/stats/prometheus.
      # Enabled by default in Envoy Gateway, made explicit here so the
      # PodMonitor in the monitoring layer has a documented contract.
      prometheus: {}
      {{- with .Values.gateway.telemetry.metrics.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.gateway.telemetry.accessLog.enabled }}
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              {{- toYaml .Values.gateway.telemetry.accessLog.json | nindent 14 }}
          sinks:
            - type: File
              file:
                path: /dev/stdout
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className | quote }}
  labels:
    {{- include "h3xinfra-gateway-pre.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gateway.controllerName | quote }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ include "h3xinfra-gateway-pre.fullname" . }}-proxy
    namespace: {{ .Release.Namespace }}
