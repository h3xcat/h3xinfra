---
# EnvoyProxy customization: applied to Envoy Gateway-managed Service so that
# MetalLB picks the right pool and the LB advertises both IPv4 and IPv6.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "h3xinfra-gateway-pre.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h3xinfra-gateway-pre.labels" . | nindent 4 }}
spec:
  # Bind the proxy's Gateway listeners dual-stack. Envoy Gateway defaults to
  # IPv4-only listeners ("IPv6 and dual-stack environments are not supported
  # in this default configuration"), so without this the pod RSTs the IPv6
  # connections the LoadBalancer VIP DNATs to it.
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          metallb.universe.tf/address-pool: {{ include "h3xinfra-gateway-pre.fullname" . }}-pool
          {{- with .Values.gateway.serviceAnnotations }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        externalTrafficPolicy: Local
        # ipFamilies / ipFamilyPolicy aren't first-class fields in EnvoyProxy
        # v1alpha1, and Kubernetes defaults a Service to SingleStack (IPv4), so
        # without this patch the pool's IPv6 VIP is never allocated: the public
        # AAAA record points at an address no node announces and dual-stack
        # clients that dial IPv6 first (including Envoy Gateway's own OIDC
        # discovery fetch) black-hole. Request both families explicitly,
        # mirroring the mailu external Service.
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilyPolicy: PreferDualStack
              ipFamilies:
                - IPv4
                - IPv6
  telemetry:
    metrics:
      # Envoy proxy exposes Prometheus metrics on :19001/stats/prometheus.
      # Enabled by default in Envoy Gateway, made explicit here so the
      # PodMonitor in the monitoring layer has a documented contract.
      prometheus: {}
      {{- with .Values.gateway.telemetry.metrics.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.gateway.telemetry.accessLog.enabled }}
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              {{- toYaml .Values.gateway.telemetry.accessLog.json | nindent 14 }}
          sinks:
            - type: File
              file:
                path: /dev/stdout
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className | quote }}
  labels:
    {{- include "h3xinfra-gateway-pre.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gateway.controllerName | quote }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ include "h3xinfra-gateway-pre.fullname" . }}-proxy
    namespace: {{ .Release.Namespace }}
