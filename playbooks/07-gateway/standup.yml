---
- import_playbook: ../99-utils/kube-connect.yml

- name: Deploy Envoy Gateway and shared Gateway resource
  hosts: k8s
  gather_facts: false

  tasks:
    - name: Create Gateway namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ gateway.namespace }}"
        state: present
        wait: true

    # K3s owns the standard Gateway API CRDs through gateway-api-crd. Do not
    # replace them with the experimental bundle or bypass its upgrade policy.
    - name: Wait for K3s-managed Gateway API CRDs
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Established
          - --timeout=60s
          - crd/gatewayclasses.gateway.networking.k8s.io
          - crd/gateways.gateway.networking.k8s.io
          - crd/httproutes.gateway.networking.k8s.io
          - crd/grpcroutes.gateway.networking.k8s.io
          - crd/referencegrants.gateway.networking.k8s.io
          - crd/backendtlspolicies.gateway.networking.k8s.io
          - crd/tcproutes.gateway.networking.k8s.io
          - crd/tlsroutes.gateway.networking.k8s.io
          - crd/udproutes.gateway.networking.k8s.io
          - crd/listenersets.gateway.networking.k8s.io
      changed_when: false

    # Envoy's own CRDs exceed Helm's 1 MiB release secret limit. Render the
    # pinned chart and manage only those CRDs with server-side kubectl.
    - name: Render Envoy Gateway CRD bundle
      ansible.builtin.command:
        cmd: >-
          helm template h3xinfra-gateway-crds
          oci://docker.io/envoyproxy/gateway-crds-helm
          --version {{ chart_versions.envoy_gateway }}
          --namespace {{ gateway.namespace }}
          --set crds.gatewayAPI.enabled=false
          --set crds.envoyGateway.enabled=true
      register: gateway_crd_render
      changed_when: false

    # Helm v4 writes OCI pull metadata ("Pulled:"/"Digest:" lines) to stdout
    # ahead of the manifests (v3 sent it to stderr), and kubectl rejects those
    # lines as a YAML document with no Kind. Strip them before staging.
    - name: Strip Helm OCI pull metadata from the rendered bundle
      ansible.builtin.set_fact:
        gateway_crd_manifests: "{{ gateway_crd_render.stdout_lines | reject('match', '^(Pulled|Digest): ') | join('\n') }}"

    # File input preserves kubectl's error when it rejects an early object;
    # streaming this large bundle can hide that error behind Ansible's EPIPE.
    - name: Reconcile Envoy Gateway CRDs
      block:
        - name: Create temporary Envoy Gateway CRD file
          ansible.builtin.tempfile:
            state: file
            prefix: h3xinfra-gateway-crds-
            suffix: .yaml
          register: gateway_crd_file
          changed_when: false

        - name: Stage Envoy Gateway CRD bundle
          ansible.builtin.copy:
            content: "{{ gateway_crd_manifests }}"
            dest: "{{ gateway_crd_file.path }}"
            mode: "0600"
          changed_when: false

        # Diff must use the same apply mode and field manager as the write.
        # rc 0 = in sync, 1 = drift, >1 = error; only drift permits an apply.
        - name: Diff Envoy Gateway CRD bundle against the cluster
          ansible.builtin.command:
            argv:
              - kubectl
              - diff
              - --server-side
              - --force-conflicts
              - --field-manager=h3xinfra-gateway-crds
              - -f
              - "{{ gateway_crd_file.path }}"
          register: gateway_crd_diff
          changed_when: false
          failed_when: gateway_crd_diff.rc not in [0, 1]

        - name: Apply Envoy Gateway CRD bundle (server-side)
          ansible.builtin.command:
            argv:
              - kubectl
              - apply
              - --server-side
              - --force-conflicts
              - --field-manager=h3xinfra-gateway-crds
              - -f
              - "{{ gateway_crd_file.path }}"
          when: gateway_crd_diff.rc == 1
          changed_when: gateway_crd_diff.rc == 1
      always:
        - name: Remove temporary Envoy Gateway CRD file
          ansible.builtin.file:
            path: "{{ gateway_crd_file.path }}"
            state: absent
          when: gateway_crd_file.path is defined
          changed_when: false

    - name: Deploy Envoy Gateway controller via Helm (OCI)
      kubernetes.core.helm:
        name: "{{ gateway.release_name_prefix }}-controller"
        chart_ref: "oci://docker.io/envoyproxy/gateway-helm"
        chart_version: "{{ chart_versions.envoy_gateway }}"
        release_namespace: "{{ gateway.namespace }}"
        create_namespace: false
        # K3s owns Gateway API; the tasks above own Envoy-specific CRDs.
        # The controller chart must not install another copy of either set.
        skip_crds: true
        values:
          # HA: 2 controller replicas so a single-node loss does not
          # take Gateway-API reconciliation offline. The data plane
          # (Envoy proxy pods rendered per Gateway) is sized separately
          # via EnvoyProxy CRs.
          deployment:
            replicas: 2
            envoyGateway:
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 256Mi
          certgen:
            job:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
                  ephemeral-storage: 256Mi
          config:
            envoyGateway:
              logging:
                level:
                  default: info
              # Required for `kind: Backend` (gateway.envoyproxy.io/v1alpha1),
              # which downstream charts can use to route HTTPRoutes at
              # off-cluster FQDN backends. ExternalName Services produce no
              # Endpoints, so Envoy Gateway returns 503 without a Backend CR.
              extensionApis:
                enableBackend: true
        state: present
        wait: true
        timeout: "300s"

    - name: Deploy Gateway pre-configuration via Helm
      kubernetes.core.helm:
        name: "{{ gateway.release_name_prefix }}-pre"
        chart_ref: "{{ playbook_dir }}/charts/h3xinfra-gateway-pre"
        namespace: "{{ gateway.namespace }}"
        create_namespace: false
        values:
          fullnameOverride: "{{ gateway.release_name_prefix }}-pre"
          wildcardCertificate:
            commonName: "{{ gateway.dns_names | first }}"
          clusterIssuerName: "{{ certmanager.release_name_prefix }}-post-default-clusterissuer"
          ipPool:
            namespace: "{{ metallb.namespace }}"
            ipAddressPools:
              addresses:
                ipv4: "{{ gateway.loadbalancer_pools.ipv4 }}"
                ipv6: "{{ gateway.loadbalancer_pools.ipv6 }}"
          gateway:
            className: "{{ gateway.release_name_prefix }}"
            allowedRoutesFrom: "All"
            listeners:
              http:
                hostname: "{{ gateway.listeners.http.hostname }}"
              https:
                hostname: "{{ gateway.listeners.https.hostname }}"
              httpsApp:
                hostname: "{{ gateway.listeners.httpsApp.hostname }}"
              httpsApex:
                hostname: "{{ gateway.listeners.httpsApex.hostname }}"
        set_values:
          - value: "wildcardCertificate.dnsNames={{ gateway.dns_names | to_json }}"
            value_type: json
        state: present
        wait: true
        timeout: "300s"

    - name: Wait for the shared Gateway to become Programmed
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        namespace: "{{ gateway.namespace }}"
        name: "{{ gateway.release_name_prefix }}-pre-shared"
      register: gw_status
      retries: 30
      delay: 10
      until: >-
        gw_status.resources | length > 0
        and (gw_status.resources[0].status.conditions | default([])
             | selectattr('type', 'equalto', 'Programmed')
             | selectattr('status', 'equalto', 'True') | list | length) > 0
