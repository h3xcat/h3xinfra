---
- import_playbook: ../99-utils/kube-connect.yml

- name: Deploy Cilium via Helm
  hosts: k8s
  gather_facts: false

  tasks:
  - name: Add Cilium Helm repository
    kubernetes.core.helm_repository:
      name: cilium
      repo_url: https://helm.cilium.io/
      state: present
      force_update: true
    changed_when: false

  # Pod Security: privileged. The Cilium agent and Envoy DaemonSets use
  # hostNetwork, hostPath, host ports, a privileged init container and
  # NET_ADMIN/SYS_ADMIN. The cluster AdmissionConfiguration also exempts
  # kube-system (the default Cilium namespace).
  - name: Create Cilium namespace
    kubernetes.core.k8s:
      state: present
      wait: true
      definition:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: "{{ cilium.namespace }}"
          labels:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted

  - name: Deploy Cilium via Helm
    kubernetes.core.helm:
      name: "{{ cilium.release_name_prefix }}-main"
      chart_ref: "cilium/cilium"
      chart_version: "{{ chart_versions.cilium }}"
      namespace: "{{ cilium.namespace }}"
      create_namespace: false
      values_files: 
      - "{{ playbook_dir }}/cilium-values.yaml"
      set_values:
      - value: "ipam.operator.clusterPoolIPv4PodCIDRList[0]={{ cluster_cidr.ipv4 }}"
        value_type: string
      - value: "ipam.operator.clusterPoolIPv6PodCIDRList[0]={{ cluster_cidr.ipv6 }}"
        value_type: string
      - value: "ipam.operator.clusterPoolIPv4MaskSize={{ cluster_cidr.ipv4_mask_size }}"
        value_type: raw
      - value: "ipam.operator.clusterPoolIPv6MaskSize={{ cluster_cidr.ipv6_mask_size }}"
        value_type: raw
      - value: "ipv4NativeRoutingCIDR={{ cluster_cidr.ipv4 }}"
        value_type: string
      - value: "ipv6NativeRoutingCIDR={{ cluster_cidr.ipv6 }}"
        value_type: string
      - value: "extraConfig.ipv6-mcast-device={{ primary_network_interface }}"
        value_type: string

      state: present
      wait: true
      timeout: "600s"

