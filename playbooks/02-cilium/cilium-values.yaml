# The shared h3xinfra-private/tests/helm suite checks resource budgets on the
# rendered chart at the inventory pin, including init containers and certgen.
resources:
  requests:
    cpu: 250m
    memory: 2Gi
    ephemeral-storage: 32Mi
  limits:
    cpu: "2"
    memory: 4Gi
    ephemeral-storage: 1Gi

initResources:
  requests:
    cpu: 100m
    memory: 64Mi
    ephemeral-storage: 32Mi
  limits:
    cpu: "1"
    memory: 256Mi
    ephemeral-storage: 256Mi

cni:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 256Mi
      ephemeral-storage: 256Mi

# The chart hashes cilium-config into the agent PodTemplate. Adoption rolls
# agents even with the host firewall off; later ConfigMap changes roll them
# too. Every restart clears host endpoint audit mode: see HOST-FIREWALL.md.
rollOutCiliumPods: true

# This limit applies to each DaemonSet, not to the fleet: the Cilium and Envoy
# controllers can update different nodes concurrently. Stage their updates
# separately when maintenance requires a global one-node-at-a-time rollout.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

envoy:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

# The chart names its ordinary (non-hook) certgen Job from a pod-spec checksum.
# Changing these resources replaces that Job; --no-hooks does not suppress it.
# Certgen reuses the existing CA with --ca-reuse-secret and can reissue leaves.
certgen:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 256Mi

# Enable both address families
ipv4:
  enabled: true
ipv6:
  enabled: true

# Use Cilium's cluster-pool IPAM
ipam:
  mode: cluster-pool

# Disable IPv6 masquerade (pods use global IPv6 directly)
enableIPv6Masquerade: false

# Use eBPF-based masquerade for IPv4 for performance
bpf:
  masquerade: true
  # Keep the CVE-2020-8554 mitigation (the chart default). No Service in this
  # stack sets spec.externalIPs. Set true only for a Service that needs them.
  disableExternalIPMitigation: false

kubeProxyReplacement: true

# Preserve source IP with direct server return.
loadBalancer:
  mode: "dsr"
  dsrDispatch: "opt"

# Disable the per-service NodePort health server (renders cilium-config
# enable-health-check-nodeport=false). On this dual-stack cluster
# (net.ipv6.bindv6only=0) the load-balancer health server loops forever on
# "bind: address already in use": for every externalTrafficPolicy=Local
# service it tries to bind BOTH 0.0.0.0 and [::] on the healthCheckNodePort,
# and with bindv6only=0 the first wildcard bind already claims the other
# family — ~126 errors/min fleet-wide across every agent. MetalLB runs in L2
# mode and tracks endpoint readiness itself, so it never consumes
# healthCheckNodePort; the server is dead weight here.
# Refs: cilium/cilium#41402 (dual-stack wildcard double-bind), #11168 (flag).
nodePort:
  enableHealthCheck: false

# Native routing is required for direct server return.
routingMode: "native"

autoDirectNodeRoutes : true

extraConfig:
  enable-ipv6-ndp: "true"

# The Cilium CA (kube-system/cilium-ca) is provisioned out-of-band as a
# 10-year cert (expires 2036-09): the chart's cronJob certgen always reuses
# the existing secret (--ca-reuse-secret) and offers no CA-validity knob
# (tls.ca.certValidityDuration only affects the helm TLS method). To rotate:
# mint a new CA (ECDSA P-256, CA:TRUE, keyCertSign+cRLSign), replace the
# cilium-ca secret, delete the hubble-server-certs and
# hubble-relay-client-certs secrets, then run a one-off job from the
# hubble-generate-certs CronJob. Hubble reloads certs without restarts.

hubble:
  tls:
    auto:
      enabled: true
      method: cronJob
      # certgen (>= v0.4.9, cilium 1.20) refuses to issue leaf certs that
      # outlive the CA, so this must stay well under the CA's remaining
      # lifetime; the CronJob renews every 4 months regardless.
      certValidityDuration: 365
      schedule: "0 0 1 */4 *"
  relay:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 32Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
    # Expose hubble-relay's own /metrics so Prometheus can scrape relay health.
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
          ephemeral-storage: 256Mi
    frontend:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
          ephemeral-storage: 256Mi
  # Per-flow metrics emitted by every cilium-agent on :9965/metrics.
  # Powers the Hubble Grafana dashboards (HTTP, DNS, TCP, drops, ...).
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
    serviceMonitor:
      enabled: true
    # Built-in Grafana dashboards shipped by the Cilium chart, surfaced to the
    # Grafana sidecar via ConfigMaps with the `grafana_dashboard: "1"` label.
    dashboards:
      enabled: true
      namespace: monitoring
      annotations:
        grafana_folder: "Cilium"

# cilium-agent metrics on :9962/metrics — required for Cilium dashboards.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
  metricsService: true
dashboards:
  enabled: true
  namespace: monitoring
  annotations:
    grafana_folder: "Cilium"

operator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 256Mi
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
    namespace: monitoring
    annotations:
      grafana_folder: "Cilium"
