---
# Static values for the upstream sealed-secrets chart. standup.yml supplies
# the names, the key Secret name and the digest-pinned image tag.
image:
  registry: docker.io
  repository: bitnami/sealed-secrets-controller
  pullPolicy: IfNotPresent

# The operator supplies the sealing key. "0" turns off scheduled key
# generation. The controller still generates a key at startup when it finds
# none, so standup.yml refuses to deploy until the key Secret exists.
keyrenewperiod: "0"
updateStatus: true

# Every GitOps Secret depends on this controller, like Argo CD itself.
priorityClassName: h3xinfra-platform-critical

# Pod Security Standard "restricted".
podSecurityContext:
  enabled: true
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests: {cpu: 20m, memory: 64Mi, ephemeral-storage: 16Mi}
  limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 64Mi}

service:
  type: ClusterIP
ingress:
  enabled: false

# The chart policy admits every source on ports 8080 and 8081. standup.yml
# adds a default-deny ingress policy instead: offline sealing needs no
# connection to the controller.
networkPolicy:
  enabled: false

rbac:
  create: true
  clusterRole: true
  namespacedRoles: false
  pspEnabled: false
  # The service proxier role lets every authenticated user reach the
  # controller through the API server proxy (cert, verify and rotate
  # endpoints). Seal offline with the committed certificate instead.
  serviceProxier:
    create: false
    bind: false

metrics:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  dashboards:
    create: false

pdb:
  create: false
