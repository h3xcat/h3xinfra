---
- import_playbook: ../99-utils/kube-connect.yml
- name: Deploy Mailu via Helm
  hosts: k8s
  gather_facts: false

  tasks:
  - name: Add Mailu Helm repository
    kubernetes.core.helm_repository:
      name: mailu
      repo_url: https://mailu.github.io/helm-charts
      state: present
      force_update: true
    changed_when: false

  # Pod Security: every Mailu pod passes baseline. The Mailu containers do not
  # set the restricted securityContext fields (runAsNonRoot, seccompProfile,
  # capabilities.drop), so restricted needs chart changes first.
  - name: Create Mailu namespace
    kubernetes.core.k8s:
      state: present
      wait: true
      definition:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: "{{ mailu.namespace }}"
          labels:
            pod-security.kubernetes.io/enforce: "{{ mailu.pod_security_enforce | default('baseline') }}"
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted

  - name: Deploy Mailu configuration via Helm
    kubernetes.core.helm:
      name: "{{ mailu.release_name_prefix }}-pre"
      chart_ref: "{{ playbook_dir }}/charts/h3xinfra-mailu-pre"
      namespace: "{{ mailu.namespace }}"
      create_namespace: false
      values:
        fullnameOverride: "{{ mailu.release_name_prefix }}-pre"
        hostname: "{{ mailu.dns_names | first }}"
        clusterIssuerName: "{{ certmanager.release_name_prefix }}-post-default-clusterissuer"
        mailuInstanceName: "{{ mailu.release_name_prefix }}-main"
        certificate:
          commonName: "{{ mailu.dns_names | first }}"
        ipPool:
          namespace: "{{ metallb.namespace }}"
          ipAddressPools:
            addresses:
              ipv4: "{{ mailu.loadbalancer_pools.ipv4 }}"
              ipv6: "{{ mailu.loadbalancer_pools.ipv6 }}"

        publicAddresses:
          ipv4: "{{ mailu.public_addresses.ipv4 }}"
          ipv6: "{{ mailu.public_addresses.ipv6 }}"
        
        networkPolicy:
          enabled: "{{ mailu.network_policy.enabled }}"
          allowedIPv6Networks: "{{ mailu.network_policy.allowed_ipv6_networks }}"

        gatewayRoute:
          enabled: true
          gateway:
            name: "{{ gateway.release_name_prefix }}-pre-shared"
            namespace: "{{ gateway.namespace }}"
          frontService:
            name: "{{ mailu.release_name_prefix }}-main-front"
            port: 443
          tlsHostname: "{{ mailu.dns_names | first }}"
          # Browser hostnames on the Gateway. Default: all dns_names.
          hostnames: "{{ mailu.web_hostnames | default([]) }}"
          oidc:
            enabled: "{{ mailu.oauth2.enabled | default(false) }}"
            issuerUrl: "{{ mailu.oauth2.oidc_issuer_url | default('') }}"
            clientId: "{{ mailu.oauth2.client_id | default('') }}"
            clientSecret: "{{ mailu.oauth2.client_secret | default('') }}"
            secretRef:
              name: "{{ mailu.release_name_prefix }}-pre-oidc"
          oidcHostname: "{{ mailu.oauth2.hostname | default('') }}"
          publicPaths: "{{ mailu.oauth2.public_paths | default([]) }}"
      set_values:
      - value: "certificate.dnsNames={{ mailu.dns_names | to_json }}"
        value_type: json
      state: present
      wait: true
      timeout: "120s"
    no_log: true

  # Helm 4 --wait uses kstatus. kstatus marks a LoadBalancer Service as ready
  # when it has a cluster IP, before MetalLB gives it an address. The mail
  # ports are on two Services that must share one MetalLB address. These tasks
  # stop the play if a Service has no address or the addresses are different.
  - name: Check the Mailu LoadBalancer addresses
    vars:
      mailu_lb_service_names:
      - "{{ mailu.release_name_prefix }}-pre-external"
      - "{{ mailu.release_name_prefix }}-pre-external-clients"
    block:
    - name: Wait until each Mailu LoadBalancer Service has an address
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ mailu.namespace }}"
      register: mailu_lb_services
      retries: 24
      delay: 5
      until: >-
        mailu_lb_services.resources | default([])
        | selectattr('metadata.name', 'in', mailu_lb_service_names)
        | map(attribute='status.loadBalancer.ingress', default=[])
        | select | list | length == mailu_lb_service_names | length

    - name: Make sure that the Mailu LoadBalancer Services share one address
      vars:
        mailu_lb_addresses: >-
          {{ mailu_lb_services.resources
             | selectattr('metadata.name', 'in', mailu_lb_service_names)
             | map(attribute='status.loadBalancer.ingress', default=[])
             | map('map', attribute='ip', default='') | map('list')
             | map('sort') | map('join', ',') | list }}
      ansible.builtin.assert:
        that:
        - mailu_lb_addresses | length == mailu_lb_service_names | length
        - mailu_lb_addresses | unique | length == 1
        fail_msg: >-
          The Mailu LoadBalancer Services {{ mailu_lb_service_names }} do not
          share one address. Addresses found: {{ mailu_lb_addresses }}.
          Run `kubectl -n {{ mailu.namespace }} describe svc` on them and
          look for MetalLB AllocationFailed events.
        quiet: true

  - name: Read the Helm 4 plugin directory
    ansible.builtin.command:
      argv: [helm, env, HELM_PLUGINS]
    register: mailu_helm_plugins
    changed_when: false
    check_mode: false

  - name: Create the Mailu shutdown plugin directory
    ansible.builtin.file:
      path: "{{ mailu_helm_plugins.stdout }}/h3xinfra-mailu-shutdown"
      state: directory
      mode: "0755"

  - name: Keep the installed Helm 4 shutdown plugin in sync with the repository
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/{{ item }}"
      dest: "{{ mailu_helm_plugins.stdout }}/h3xinfra-mailu-shutdown/{{ item }}"
      mode: "{{ '0755' if item == 'shutdown-post-renderer.py' else '0644' }}"
    loop:
    - plugin.yaml
    - shutdown-post-renderer.py
    - graceful-stop.py
    - graceful-stop-clamav.sh

  - name: Deploy Mailu via Helm
    kubernetes.core.helm:
      name: "{{ mailu.release_name_prefix }}-main"
      chart_ref: "mailu/mailu"
      chart_version: "{{ chart_versions.mailu }}"
      namespace: "{{ mailu.namespace }}"
      create_namespace: false
      post_renderer: h3xinfra-mailu-shutdown
      
      values:
        global:
          storageClass: "longhorn"
          database:
            roundcube:
              password: "{{ mailu.db_password }}"

        domain: "{{ mailu.domain }}"

        secretKey: "{{ mailu.secret_key }}"
        logLevel: "INFO"
        subnet6: "{{ cluster_cidr.ipv6 }}"

        tls:
          outboundLevel: "dane"

        initialAccount:
          enabled: true
          username: "admin"
          domain: "{{ mailu.domain }}"
          password: "{{ mailu.admin_password }}"

        externalRelay:
          host: "{{ mailu.external_relay_host }}"
          username: "{{ mailu.external_relay_username }}"
          password: "{{ mailu.external_relay_password }}"

        ingress:
          # The pre-chart routes the browser UI through Envoy Gateway and
          # publishes mail protocols on its own LoadBalancer Services.
          enabled: false
          # The chart's `front` Deployment still mounts /certs from a TLS
          # Secret regardless of whether an Ingress is rendered. Point it
          # at the cert-manager Secret created by the pre-chart so we
          # don't end up looking for a `<release>-certificates` Secret
          # that the chart never creates when ingress is disabled.
          existingSecret: "{{ mailu.release_name_prefix }}-pre-certificate"

        persistence:
          single_pvc: false
          storageClass: "longhorn"

        front:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          hostPort:
            enabled: false

        redis:
          master:
            terminationGracePeriodSeconds: 120
            persistence:
              storageClass: "longhorn"

        admin:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        webmail:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        postfix:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        dovecot:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        rspamd:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"
          # overrides:
          #   # dkim_signing.conf: |
          #   #   sign_headers = (o)from:(x)sender:(o)reply-to:(o)subject:(o)to:(o)cc:(x)mime-version:(x)content-type:(x)content-transfer-encoding:resent-to:resent-cc:resent-from:resent-sender:resent-message-id:(x)in-reply-to:(x)references:list-id:list-help:list-owner:list-unsubscribe:list-unsubscribe-post:list-subscribe:list-post:(x)openpgp:(x)autocrypt
          #   dkim_signing.conf: |
          #     sign_headers = (o)from:(x)sender:(o)reply-to:(o)subject:(o)to:(o)cc:(x)mime-version:(x)content-type:(x)content-transfer-encoding:resent-to:resent-cc:resent-from:resent-sender:resent-message-id:(x)in-reply-to:(x)references:list-id:list-help:list-owner:list-unsubscribe:list-unsubscribe-post:list-subscribe:list-post:(x)openpgp:(x)autocrypt:
          #   Message-ID, Date, Return-Path, Bounces-To.
        clamav:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "1536Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
          persistence:
            storageClass: "longhorn"

        oletools:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

        tika:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

      set_values:
      - value: "hostnames={{ mailu.dns_names | to_json }}"
        value_type: json
      state: present
      wait: true
      timeout: "900s"
    no_log: true
