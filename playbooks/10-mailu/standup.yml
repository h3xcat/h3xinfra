---
- import_playbook: ../99-utils/kube-connect.yml
- name: Deploy Mailu via Helm
  hosts: k8s
  gather_facts: false

  tasks:
  - name: Add Mailu Helm repository
    kubernetes.core.helm_repository:
      name: mailu
      repo_url: https://mailu.github.io/helm-charts
      state: present
      force_update: true
    changed_when: false

  - name: Create Mailu namespace
    kubernetes.core.k8s:
      api_version: v1
      kind: Namespace
      name: "{{ mailu.namespace }}"
      state: present
      wait: true

  - name: Deploy Mailu configuration via Helm
    kubernetes.core.helm:
      name: "{{ mailu.release_name_prefix }}-pre"
      chart_ref: "{{ playbook_dir }}/charts/h3xinfra-mailu-pre"
      namespace: "{{ mailu.namespace }}"
      create_namespace: false
      values:
        fullnameOverride: "{{ mailu.release_name_prefix }}-pre"
        hostname: "{{ mailu.dns_names | first }}"
        clusterIssuerName: "{{ certmanager.release_name_prefix }}-post-default-clusterissuer"
        mailuInstanceName: "{{ mailu.release_name_prefix }}-main"
        certificate:
          commonName: "{{ mailu.dns_names | first }}"
        ipPool:
          namespace: "{{ metallb.namespace }}"
          ipAddressPools:
            addresses:
              ipv4: "{{ mailu.loadbalancer_pools.ipv4 }}"
              ipv6: "{{ mailu.loadbalancer_pools.ipv6 }}"

        publicAddresses:
          ipv4: "{{ mailu.public_addresses.ipv4 }}"
          ipv6: "{{ mailu.public_addresses.ipv6 }}"
        
        networkPolicy:
          enabled: "{{ mailu.network_policy.enabled }}"
          allowedIPv6Networks: "{{ mailu.network_policy.allowed_ipv6_networks }}"

        gatewayRoute:
          enabled: true
          gateway:
            name: "{{ gateway.release_name_prefix }}-pre-shared"
            namespace: "{{ gateway.namespace }}"
          frontService:
            name: "{{ mailu.release_name_prefix }}-main-front"
            port: 443
          tlsHostname: "{{ mailu.dns_names | first }}"
          oidc:
            enabled: "{{ mailu.oauth2.enabled | default(false) }}"
            issuerUrl: "{{ mailu.oauth2.oidc_issuer_url | default('') }}"
            clientId: "{{ mailu.oauth2.client_id | default('') }}"
            clientSecret: "{{ mailu.oauth2.client_secret | default('') }}"
            secretRef:
              name: "{{ mailu.release_name_prefix }}-pre-oidc"
          oidcHostname: "{{ mailu.oauth2.hostname | default('') }}"
          publicPaths: "{{ mailu.oauth2.public_paths | default([]) }}"
      set_values:
      - value: "certificate.dnsNames={{ mailu.dns_names | to_json }}"
        value_type: json
      state: present
      wait: true
      timeout: "120s"
    no_log: true

  - name: Read Helm version for shutdown renderer compatibility
    ansible.builtin.command:
      argv: [helm, version, --short]
    register: mailu_helm_version
    changed_when: false
    check_mode: false

  - name: Read the Helm 4 plugin directory
    ansible.builtin.command:
      argv: [helm, env, HELM_PLUGINS]
    register: mailu_helm_plugins
    changed_when: false
    check_mode: false
    when: mailu_helm_version.stdout is match('v4\\.')

  - name: Create the Mailu shutdown plugin directory
    ansible.builtin.file:
      path: "{{ mailu_helm_plugins.stdout }}/h3xinfra-mailu-shutdown"
      state: directory
      mode: "0755"
    when: mailu_helm_version.stdout is match('v4\\.')

  - name: Keep the installed Helm 4 shutdown plugin in sync with the repository
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/{{ item }}"
      dest: "{{ mailu_helm_plugins.stdout }}/h3xinfra-mailu-shutdown/{{ item }}"
      mode: "{{ '0755' if item == 'shutdown-post-renderer.py' else '0644' }}"
    loop:
    - plugin.yaml
    - shutdown-post-renderer.py
    - graceful-stop.py
    - graceful-stop-clamav.sh
    when: mailu_helm_version.stdout is match('v4\\.')

  - name: Deploy Mailu via Helm
    kubernetes.core.helm:
      name: "{{ mailu.release_name_prefix }}-main"
      chart_ref: "mailu/mailu"
      chart_version: "{{ chart_versions.mailu }}"
      namespace: "{{ mailu.namespace }}"
      create_namespace: false
      post_renderer: >-
        {{ 'h3xinfra-mailu-shutdown' if mailu_helm_version.stdout is match('v4\\.')
           else playbook_dir ~ '/shutdown-post-renderer.py' }}
      
      values:
        global:
          storageClass: "longhorn"
          database:
            roundcube:
              password: "{{ mailu.db_password }}"

        domain: "{{ mailu.domain }}"

        secretKey: "{{ mailu.secret_key }}"
        logLevel: "INFO"
        subnet6: "{{ cluster_cidr.ipv6 }}"

        tls:
          outboundLevel: "dane"

        initialAccount:
          enabled: true
          username: "admin"
          domain: "{{ mailu.domain }}"
          password: "{{ mailu.admin_password }}"

        externalRelay:
          host: "{{ mailu.external_relay_host }}"
          username: "{{ mailu.external_relay_username }}"
          password: "{{ mailu.external_relay_password }}"

        ingress:
          # Mailu's front LB Service is the single entry point for SMTP/IMAP
          # AND HTTP/HTTPS (admin/webmail). The chart's Ingress block was an
          # optional shortcut for ingress-nginx; with Envoy Gateway gone for
          # mail traffic, we rely on the front LB exclusively. IP allowlist
          # for HTTP/HTTPS is enforced by Mailu itself.
          enabled: false
          # The chart's `front` Deployment still mounts /certs from a TLS
          # Secret regardless of whether an Ingress is rendered. Point it
          # at the cert-manager Secret created by the pre-chart so we
          # don't end up looking for a `<release>-certificates` Secret
          # that the chart never creates when ingress is disabled.
          existingSecret: "{{ mailu.release_name_prefix }}-pre-certificate"

        persistence:
          single_pvc: false
          storageClass: "longhorn"

        front:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.front.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.front.requests.memory | default('384Mi') }}"
            limits:
              cpu: "{{ mailu.resources.front.limits.cpu | default('1') }}"
              memory: "{{ mailu.resources.front.limits.memory | default('1Gi') }}"
          hostPort:
            enabled: false
          externalService:
            type: "LoadBalancer"
            annotations:
              metallb.universe.tf/address-pool: "{{ mailu.release_name_prefix }}-pre-pool"

        mariadb:
          primary:
            persistence:
              enabled: true
              storageClass: "longhorn"
              size: "100Gi"

        redis:
          master:
            terminationGracePeriodSeconds: 120
            persistence:
              storageClass: "longhorn"

        admin:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.admin.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.admin.requests.memory | default('256Mi') }}"
            limits:
              cpu: "{{ mailu.resources.admin.limits.cpu | default('1') }}"
              memory: "{{ mailu.resources.admin.limits.memory | default('768Mi') }}"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        webmail:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.webmail.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.webmail.requests.memory | default('192Mi') }}"
            limits:
              cpu: "{{ mailu.resources.webmail.limits.cpu | default('1') }}"
              memory: "{{ mailu.resources.webmail.limits.memory | default('512Mi') }}"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        postfix:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.postfix.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.postfix.requests.memory | default('128Mi') }}"
            limits:
              cpu: "{{ mailu.resources.postfix.limits.cpu | default('1') }}"
              memory: "{{ mailu.resources.postfix.limits.memory | default('512Mi') }}"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        dovecot:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.dovecot.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.dovecot.requests.memory | default('256Mi') }}"
            limits:
              cpu: "{{ mailu.resources.dovecot.limits.cpu | default('1') }}"
              memory: "{{ mailu.resources.dovecot.limits.memory | default('1Gi') }}"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        rspamd:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.rspamd.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.rspamd.requests.memory | default('384Mi') }}"
            limits:
              cpu: "{{ mailu.resources.rspamd.limits.cpu | default('2') }}"
              memory: "{{ mailu.resources.rspamd.limits.memory | default('1Gi') }}"
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"
          # overrides:
          #   # dkim_signing.conf: |
          #   #   sign_headers = (o)from:(x)sender:(o)reply-to:(o)subject:(o)to:(o)cc:(x)mime-version:(x)content-type:(x)content-transfer-encoding:resent-to:resent-cc:resent-from:resent-sender:resent-message-id:(x)in-reply-to:(x)references:list-id:list-help:list-owner:list-unsubscribe:list-unsubscribe-post:list-subscribe:list-post:(x)openpgp:(x)autocrypt
          #   dkim_signing.conf: |
          #     sign_headers = (o)from:(x)sender:(o)reply-to:(o)subject:(o)to:(o)cc:(x)mime-version:(x)content-type:(x)content-transfer-encoding:resent-to:resent-cc:resent-from:resent-sender:resent-message-id:(x)in-reply-to:(x)references:list-id:list-help:list-owner:list-unsubscribe:list-unsubscribe-post:list-subscribe:list-post:(x)openpgp:(x)autocrypt:
          #   Message-ID, Date, Return-Path, Bounces-To.
        clamav:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.clamav.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.clamav.requests.memory | default('1536Mi') }}"
            limits:
              cpu: "{{ mailu.resources.clamav.limits.cpu | default('2') }}"
              memory: "{{ mailu.resources.clamav.limits.memory | default('4Gi') }}"
          persistence:
            storageClass: "longhorn"

        oletools:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.oletools.requests.cpu | default('50m') }}"
              memory: "{{ mailu.resources.oletools.requests.memory | default('64Mi') }}"
            limits:
              cpu: "{{ mailu.resources.oletools.limits.cpu | default('500m') }}"
              memory: "{{ mailu.resources.oletools.limits.memory | default('256Mi') }}"

        tika:
          terminationGracePeriodSeconds: 120
          resources:
            requests:
              cpu: "{{ mailu.resources.tika.requests.cpu | default('100m') }}"
              memory: "{{ mailu.resources.tika.requests.memory | default('768Mi') }}"
            limits:
              cpu: "{{ mailu.resources.tika.limits.cpu | default('2') }}"
              memory: "{{ mailu.resources.tika.limits.memory | default('2Gi') }}"

        webdav:
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        fetchmail:
          persistence:
            storageClass: "longhorn"
          updateStrategy:
            type: "Recreate"

        postgresql:
          primary:
            persistence:
              storageClass: "longhorn"

      set_values:
      - value: "hostnames={{ mailu.dns_names | to_json }}"
        value_type: json
      state: present
      wait: true
      timeout: "900s"
    no_log: true
