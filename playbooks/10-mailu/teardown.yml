---
# Stops here unless run with -e confirm_destroy=yes-destroy-data.
- name: Require confirmation before teardown
  import_playbook: ../99-utils/confirm-destroy.yml

- import_playbook: ../99-utils/kube-connect.yml

- name: Remove Mailu via Helm
  hosts: k8s
  gather_facts: false

  # mailu.external_workloads: another tool owns the namespace and the main
  # release workloads with their volumes. This play then removes only the pre
  # release.
  tasks:
  - name: Uninstall Mailu via Helm
    when: not (mailu.external_workloads | default(false) | bool)
    kubernetes.core.helm:
      name: "{{ mailu.release_name_prefix }}-main"
      namespace: "{{ mailu.namespace }}"
      state: absent
      wait: true
      timeout: "300s"

  - name: Uninstall Mailu configuration via Helm
    kubernetes.core.helm:
      name: "{{ mailu.release_name_prefix }}-pre"
      namespace: "{{ mailu.namespace }}"
      state: absent
      wait: true
      timeout: "300s"

  - name: Remove Mailu namespace
    when: not (mailu.external_workloads | default(false) | bool)
    kubernetes.core.k8s:
      api_version: v1
      kind: Namespace
      name: "{{ mailu.namespace }}"
      state: absent
      wait: true
      wait_timeout: 300
