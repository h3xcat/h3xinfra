{{- if .Values.networkPolicy.enabled }}
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "h3xinfra-mailu-pre.fullname" . }}-email-access-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h3xinfra-mailu-pre.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "h3xinfra-mailu-pre.frontSelector" . | nindent 6 }}
  ingress:
  # Mail transfer and authenticated submission accept any external source.
  - fromEntities:
    - "world"
    toPorts:
    - ports:
      - port: "25"
        protocol: TCP
      - port: "465"
        protocol: TCP

  # IMAPS, POP3S and ManageSieve share the client-Service source ranges.
  - fromCIDRSet:
    {{- range include "h3xinfra-mailu-pre.clientSourceRanges" . | fromYamlArray }}
    - cidr: {{ . | quote }}
    {{- end }}
    toPorts:
    - ports:
      - port: "993"
        protocol: TCP
      - port: "995"
        protocol: TCP
      - port: "4190"
        protocol: TCP

  # Allow cluster-internal traffic (for health checks, etc.)
  - fromEntities:
    - "cluster"
    - "kube-apiserver"

  # Allow traffic from the same namespace
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
{{- end }}
