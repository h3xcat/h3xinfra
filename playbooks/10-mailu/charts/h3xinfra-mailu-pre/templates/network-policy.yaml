{{- if .Values.networkPolicy.enabled }}
---
# Namespace baseline: every pod in the namespace accepts ingress only from
# pods in the same namespace. Policies are additive, so the front policy below
# adds the mail and web entry points. Without it, every pod in the cluster
# reaches Postfix (which relays for the pod CIDR), Rspamd, ClamAV, Tika, LMTP
# and the admin API. The Mailu chart's Redis policy is a separate
# NetworkPolicy; standup.yml limits it to this namespace. With the current
# Cilium settings (allow-localhost default, no host firewall), Cilium allows
# traffic from the local node, so kubelet probes continue to work.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "h3xinfra-mailu-pre.fullname" . }}-same-namespace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h3xinfra-mailu-pre.labels" . | nindent 4 }}
spec:
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "h3xinfra-mailu-pre.fullname" . }}-email-access-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h3xinfra-mailu-pre.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "h3xinfra-mailu-pre.frontSelector" . | nindent 6 }}
  ingress:
  # Mail transfer and authenticated submission accept any external source.
  - fromEntities:
    - "world"
    toPorts:
    - ports:
      - port: "25"
        protocol: TCP
      - port: "465"
        protocol: TCP

  # IMAPS, POP3S and ManageSieve share the client-Service source ranges.
  - fromCIDRSet:
    {{- range include "h3xinfra-mailu-pre.clientSourceRanges" . | fromYamlArray }}
    - cidr: {{ . | quote }}
    {{- end }}
    toPorts:
    - ports:
      - port: "993"
        protocol: TCP
      - port: "995"
        protocol: TCP
      - port: "4190"
        protocol: TCP

  # In-cluster senders (Keycloak realm mail) submit with authentication on
  # 465. Port 25 stays closed to the cluster: front proxies it to Postfix,
  # which relays for the pod CIDR without authentication.
  - fromEntities:
    - "cluster"
    toPorts:
    - ports:
      - port: "465"
        protocol: TCP
  {{- if .Values.gatewayRoute.enabled }}

  # The Envoy Gateway proxies reach the web UI port of the HTTPRoute. The
  # Mailu front Service maps this port to the same container port.
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: {{ required "networkPolicy requires gatewayRoute.gateway.namespace" .Values.gatewayRoute.gateway.namespace | quote }}
        gateway.envoyproxy.io/owning-gateway-name: {{ required "networkPolicy requires gatewayRoute.gateway.name" .Values.gatewayRoute.gateway.name | quote }}
        gateway.envoyproxy.io/owning-gateway-namespace: {{ .Values.gatewayRoute.gateway.namespace | quote }}
    toPorts:
    - ports:
      - port: {{ .Values.gatewayRoute.frontService.port | quote }}
        protocol: TCP
  {{- end }}

  # Allow traffic from the same namespace
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
{{- end }}
