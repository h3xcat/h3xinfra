# Default values for mailu-custom-resources
# This file contains default values for your custom resources

# Hostname configuration
hostname: mail.app.example.com


publicAddresses:
  ipv4: ""
  ipv6: ""

ipPool:
  namespace: metallb-system
  ipAddressPools:
    addresses:
      ipv4: ""
      ipv6: ""
  autoAssign: false



# Cluster issuer for certificate management
clusterIssuerName: ""

# Certificate configuration
certificate:
  # Common name for the certificate
  commonName: ""
  
  # DNS names to include in the certificate
  dnsNames: []
  
# HTTPRoute / BackendTLSPolicy that publishes Mailu's web UI through
# the shared Envoy Gateway. Disabled by default so chart consumers must
# opt in and supply their gateway and front-service references.
gatewayRoute:
  enabled: false
  gateway:
    name: ""
    namespace: ""
  frontService:
    # Name of the Mailu chart's front Service (terminates TLS on 443).
    name: ""
    port: 443
  # Hostnames of the web routes on the shared Gateway. Empty means
  # certificate.dnsNames. Set it to the browser hostnames only when other
  # names in certificate.dnsNames are for mail protocols. Then the Gateway
  # does not serve the web UI for these protocol names.
  hostnames: []
  # SNI/hostname used when validating the upstream TLS connection.
  # Defaults to certificate.commonName when unset.
  tlsHostname: ""
  # Keycloak OIDC gate enforced at the Envoy Gateway via a SecurityPolicy
  # attached to the web HTTPRoute. Unauthenticated requests are redirected
  # to the issuer and the callback is handled by Envoy itself (no
  # oauth2-proxy sidecar). Mail protocols ride the separate front LB and
  # are unaffected.
  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    scopes: ["openid", "email", "profile"]
    secretRef:
      name: ""
  # Browser-facing hostname that carries the OIDC gate and receives the
  # /oauth2/callback. Must be one of certificate.dnsNames. Defaults to
  # certificate.commonName when unset.
  oidcHostname: ""
  # Path prefixes kept publicly reachable (no OIDC) for mail-client
  # autoconfig/autodiscovery. Rendered as a separate, unpolicied HTTPRoute
  # whose more-specific path matches win over the catch-all web route.
  publicPaths: []

# Redis for Mailu (templates/redis.yaml). standup.yml points the Mailu chart
# at it with externalRedis.
redis:
  # Required tag comes from image_versions.mailu_redis in the inventory.
  image:
    repository: "docker.io/library/redis"
    tag: ""
    pullPolicy: IfNotPresent
  persistence:
    storageClass: "longhorn"
    size: "1Gi"
  # Measured on the Bitnami Redis (2026-11-20): at most 17Mi working set
  # and 41m CPU in 30 days, with a 2Mi dataset.
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Network Policy configuration
networkPolicy:
  # Enable the Cilium Network Policies: a namespace baseline (ingress only
  # from pods in the release namespace) and the front policy (world 25/465,
  # client CIDRs 993/995/4190, cluster 465, and the Envoy Gateway proxies to
  # gatewayRoute.frontService.port when gatewayRoute.enabled)
  enabled: true
  
  # Additional IPv6 networks to allow access to restricted ports (IMAPS, POP3S, Sieve)
  # These are in addition to RFC 1918 private networks and ULA ranges
  # The chart also adds these networks to loadBalancerSourceRanges of the
  # client-port Service (external-svc.yaml), also when the policy is disabled.
  allowedIPv6Networks: []
