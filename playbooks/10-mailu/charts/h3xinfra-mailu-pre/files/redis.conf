# Redis for Mailu. Mailu does not support Redis authentication, so there is
# no password. The NetworkPolicy in templates/redis.yaml admits only pods in
# the release namespace.
port 6379
protected-mode no
dir /data

# The same persistence as the Bitnami Redis of the Mailu chart: append-only
# file with fsync every second, and no RDB snapshots.
appendonly yes
appendfsync everysec
save ""

# Mailu never flushes a database. The Bitnami Redis also disabled these.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
