{{- /* Envoy Gateway 1.9 supports rule-level SecurityPolicy attachment.
Restrict only the admin rule; public realm/discovery routes stay reachable.
An empty allowlist keeps admin access denied. */ -}}
{{- if .Values.ingress.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "h3xinfra-keycloak-pre.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "h3xinfra-keycloak-pre.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "h3xinfra-keycloak-pre.fullname" . }}
      sectionName: admin
  authorization:
    defaultAction: Deny
    {{- if .Values.ingress.trustedSetupIPs }}
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            {{- range .Values.ingress.trustedSetupIPs }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
