{{- if .Values.postgres.enabled }}
{{- $antiAffinity := .Values.postgres.podAntiAffinityType | default "required" }}
{{- if not (has $antiAffinity (list "preferred" "required")) }}
{{- fail "postgres.podAntiAffinityType must be preferred or required" }}
{{- end }}
---
# CloudNativePG-managed Postgres cluster backing Keycloak.
# Replaces the previous single-pod StatefulSet so a node failure does
# not take the auth database offline.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "h3xinfra-keycloak-pre.postgresName" . }}
  labels:
    {{- include "h3xinfra-keycloak-pre.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  instances: {{ .Values.postgres.instances | default 2 }}
  imageName: {{ printf "%s:%s" .Values.postgres.image.repository (.Values.postgres.image.tag | toString) | quote }}
  # Keep each instance on a different node. With `required` (the default),
  # the primary and the standby never share a node, so one node failure
  # cannot stop both. A drained instance normally finds a free node. These
  # pods have no nodeSelector or toleration, so they can run on every agent
  # node. The CNPG PostgreSQL images are multi-arch. Longhorn RWO volumes
  # attach on any node. If no free node is available, the instance stays
  # Pending. It does not share a node with the other instance (intended).
  affinity:
    podAntiAffinityType: {{ $antiAffinity }}
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database | quote }}
      owner: {{ .Values.postgres.username | quote }}
      secret:
        name: {{ include "h3xinfra-keycloak-pre.postgresCredentialsSecretName" . }}
  storage:
    storageClass: {{ .Values.postgres.persistence.storageClass | quote }}
    size: {{ .Values.postgres.persistence.size | quote }}
  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
