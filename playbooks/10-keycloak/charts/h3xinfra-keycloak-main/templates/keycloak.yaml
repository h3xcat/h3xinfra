---
{{- /*
The same value is the HTTPRoute hostname in the pre-chart, so it must be a
bare lowercase DNS name: no scheme, port, path or wildcard. A label can
have a maximum of 63 characters, and the name a maximum of 253.
*/}}
{{- $hostname := required "hostname is required" .Values.hostname }}
{{- if or (gt (len $hostname) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $hostname)) }}
{{- fail (printf "hostname %q must be a bare lowercase DNS name without scheme, port, path or wildcard, with a maximum of 63 characters for each label and 253 in total" $hostname) }}
{{- end }}
# Keycloak instance managed by the Keycloak Operator
# (k8s.keycloak.org/v2alpha1). The operator owns the StatefulSet, the
# Service, anti-affinity, the PDB, JGroups KUBE_PING discovery for
# multi-replica Infinispan cache, rolling upgrades, etc.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ include "h3xinfra-keycloak-main.fullname" . }}
  labels:
    {{- include "h3xinfra-keycloak-main.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.instances | default 2 }}
  image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
  startOptimized: false
  hostname:
    # Public hostname Keycloak advertises for the issuer and redirect
    # URIs. TLS is terminated at the Envoy Gateway, so Keycloak speaks
    # plain HTTP internally.
    hostname: {{ $hostname | quote }}
    # strict (the Keycloak default) makes Keycloak fail at startup if no
    # hostname is set. Without strict mode and without a hostname,
    # Keycloak takes the hostname from request headers. With the fixed
    # hostname above, the issuer does not change.
    strict: true
  http:
    httpEnabled: true
  proxy:
    # Honor X-Forwarded-* set by the Envoy Gateway listener.
    headers: xforwarded
  bootstrapAdmin:
    user:
      secret: {{ required "bootstrapAdminSecretName is required" .Values.bootstrapAdminSecretName | quote }}
  db:
    vendor: postgres
    host: {{ required "database.host is required" .Values.database.host | quote }}
    port: {{ .Values.database.port | default 5432 }}
    database: {{ .Values.database.database | quote }}
    usernameSecret:
      name: {{ required "database.credentialsSecretName is required" .Values.database.credentialsSecretName | quote }}
      key: username
    passwordSecret:
      name: {{ .Values.database.credentialsSecretName | quote }}
      key: password
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.additionalOptions }}
  additionalOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
