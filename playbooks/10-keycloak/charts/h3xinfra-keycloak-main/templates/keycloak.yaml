---
{{- /*
The same value is the HTTPRoute hostname in the pre-chart, so it must be a
bare lowercase DNS name: no scheme, port, path or wildcard. A label can
have a maximum of 63 characters, and the name a maximum of 253.
*/}}
{{- $hostname := required "hostname is required" .Values.hostname }}
{{- if or (gt (len $hostname) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $hostname)) }}
{{- fail (printf "hostname %q must be a bare lowercase DNS name without scheme, port, path or wildcard, with a maximum of 63 characters for each label and 253 in total" $hostname) }}
{{- end }}
# Keycloak instance managed by the Keycloak Operator
# (k8s.keycloak.org/v2beta1). The operator owns the StatefulSet, the
# Service, soft topology spread constraints, JGroups KUBE_PING discovery
# for multi-replica Infinispan cache, and rolling upgrades. This chart sets
# the required pod anti-affinity below and owns the PDB in
# templates/pdb.yaml.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ include "h3xinfra-keycloak-main.fullname" . }}
  labels:
    {{- include "h3xinfra-keycloak-main.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.instances | default 2 }}
  image: {{ printf "%s:%s" .Values.image.repository (required "image.tag is required" .Values.image.tag | toString) | quote }}
  startOptimized: false
  hostname:
    # Public hostname Keycloak advertises for the issuer and redirect
    # URIs. TLS is terminated at the Envoy Gateway, so Keycloak speaks
    # plain HTTP internally.
    hostname: {{ $hostname | quote }}
    # strict (the Keycloak default) makes Keycloak fail at startup if no
    # hostname is set. Without strict mode and without a hostname,
    # Keycloak takes the hostname from request headers. With the fixed
    # hostname above, the issuer does not change.
    strict: true
  http:
    httpEnabled: true
  proxy:
    # Honor X-Forwarded-* set by the Envoy Gateway listener. The gateway
    # removes client-supplied copies first, and proxyTrustedAddresses
    # limits which sources can set them.
    headers: xforwarded
  {{- if .Values.networkPolicy.enabled }}
  networkPolicy:
    # templates/networkpolicy.yaml owns ingress for these pods. The
    # operator policy allows the HTTP port from every pod and would
    # cancel it (Cilium adds allow rules from all policies together).
    enabled: false
  {{- end }}
  bootstrapAdmin:
    user:
      secret: {{ required "bootstrapAdminSecretName is required" .Values.bootstrapAdminSecretName | quote }}
  db:
    vendor: postgres
    host: {{ required "database.host is required" .Values.database.host | quote }}
    port: 5432
    database: {{ .Values.database.database | quote }}
    usernameSecret:
      name: {{ required "database.credentialsSecretName is required" .Values.database.credentialsSecretName | quote }}
      key: username
    passwordSecret:
      name: {{ .Values.database.credentialsSecretName | quote }}
      key: password
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  scheduling:
    # The operator copies this affinity into the StatefulSet and keeps its
    # own soft spread constraints.
    affinity:
      # The operator spread is ScheduleAnyway, so it allows every replica on
      # one node, and one node failure then stops all logins. Require one
      # replica per node. Each instance needs its own schedulable node.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                {{- include "h3xinfra-keycloak-main.podSelectorLabels" . | nindent 16 }}
                app.kubernetes.io/component: server
      # Prefer the faster amd64 nodes (the MS-01s) but stay schedulable on
      # the arm64 Pis (the image is multi-arch) when amd64 nodes are drained
      # or down.
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values: ["amd64"]
  {{- with .Values.proxyTrustedAddresses }}
  additionalOptions:
    - name: proxy-trusted-addresses
      value: {{ join "," . | quote }}
  {{- end }}
