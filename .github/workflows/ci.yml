# Self-contained CI for h3xcat/h3xinfra (the public core).
# `minimal` runs the public checks; `ci-ok` is the aggregate check to require
# and the one Renovate's automerge waits for (platformAutomerge=false in
# renovate.json).
#
# Every `uses:` is pinned to a full commit SHA with its tag in a comment
# (helpers:pinGitHubActionDigests keeps them current). Tool versions are env
# pins with `# renovate:` markers directly above them (generic regex
# customManager, "CI tooling" group); keep them equal to
# h3xinfra-private/tests/tool-versions.env.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"  # weekly: rerun the self-contained public checks

permissions:
  contents: read

concurrency:
  # Only PR runs cancel each other: push, schedule and workflow_dispatch share
  # refs/heads/main and a cancelled run leaves a red ci-ok on that commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=renovatebot/renovate
  RENOVATE_VERSION: 44.221.6
  # renovate 44.x needs node ^24.11
  # renovate: datasource=node-version depName=node
  NODE_VERSION: 26.13.0
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # >= 1.16.2 is required by playbooks/10-keycloak/terraform/providers.tf
  # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$
  TERRAFORM_VERSION: 1.17.1
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: 1.38.0
  # the devcontainer's ansible-core line (syntax-check only needs a parser)
  # renovate: datasource=pypi depName=ansible-core
  ANSIBLE_CORE_VERSION: 2.21.6
  PYTHON_VERSION: "3.12"

jobs:
  minimal:
    name: minimal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANSIBLE_VAULT_PASSWORD: ci-dummy  # vaulted vars only need to parse
      ANSIBLE_FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: renovate-config-validator --strict
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict --no-global renovate.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "yamllint==${YAMLLINT_VERSION}" "ansible-core==${ANSIBLE_CORE_VERSION}"
      - name: yamllint (shared configuration)
        run: yamllint -c .yamllint.yml playbooks inventory renovate.json requirements.yml .github
      - name: ansible-playbook --syntax-check (own inventory)
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r requirements.yml </dev/null
          # playbooks are list-shaped YAML; vars/values files are maps. A file
          # that does not even parse is kept so ansible-playbook reports the
          # YAML error instead of the count silently shrinking.
          mapfile -t playbooks < <(find playbooks -maxdepth 2 \( -name '*.yml' -o -name '*.yaml' \) -not -path '*/charts/*' -print0 \
            | python3 -c 'import sys,yaml
          for f in filter(None, sys.stdin.buffer.read().split(b"\0")):
              f = f.decode()
              try: doc = yaml.safe_load(open(f))
              except Exception: doc = []
              if isinstance(doc, list): print(f)' | sort)
          echo "${#playbooks[@]} playbooks"
          rc=0
          for pb in "${playbooks[@]}"; do
            ansible-playbook --syntax-check "$pb" </dev/null >/dev/null || { echo "::error file=$pb::syntax-check failed"; rc=1; }
          done
          exit "$rc"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint --strict + template (defaults plus the values the charts `require`)
        # Without the private test values, satisfy every `required`/`fail`
        # guard with fakes; unknown keys are ignored by the other charts.
        run: |
          set -euo pipefail
          rc=0
          for chart in playbooks/*/charts/*/; do
            helm lint --strict "$chart" >/dev/null || { echo "::error::helm lint $chart"; rc=1; }
            if helm template t "$chart" -n test-ns \
                --set domain=example.com \
                --set hostname=keycloak.example.com --set bootstrapAdminSecretName=fake --set database.host=db --set database.credentialsSecretName=fake \
                --set bootstrapSecret.adminPassword=FAKE --set postgres.password=FAKE \
                --set image.tag=0.0.0 --set postgres.image.tag=0.0.0 \
                --set 'clusterIssuer.acme.dnsZones={example.com}' --set cloudflareApiToken.token=FAKE >/dev/null; then
              echo "ok   $chart"
            else
              echo "::error::helm template $chart"; rc=1
            fi
          done
          exit "$rc"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Test all public playbook layers
        run: |
          set -euo pipefail
          for test_dir in playbooks/*/tests; do
            compgen -G "$test_dir/test_*.py" >/dev/null || continue
            python -m unittest discover -s "$test_dir" -p 'test_*.py' -v
          done
      - name: terraform validate playbooks/10-keycloak/terraform
        working-directory: playbooks/10-keycloak/terraform
        run: |
          set -euo pipefail
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
          git diff --exit-code -- .terraform.lock.hcl

  ci-ok:
    name: ci-ok
    if: always()
    needs: [minimal]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job failed or was cancelled"; exit 1
          fi
